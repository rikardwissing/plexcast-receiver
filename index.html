<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="icon.png">
  <title>Portage</title>
<style>
  :root {
    color-scheme: dark;
    --accent: #19D8E6;   /* electric cyan — the app's primary */
    --blue:   #268CFF;   /* glow gradient bridge */
    --violet: #7B45F6;   /* conversion family */
    --deep:   #0B0D22;   /* midnight navy surface */
    --ink:    #F4F7FF;
    --muted:  #AEB7D4;
    --glow: linear-gradient(135deg, #19E2D3, var(--blue), var(--violet));
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; color: #F4F7FF; color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; }
  /* The mark's own light in a dark room: electric cyan on midnight navy. */
  body { background: radial-gradient(1200px 640px at 50% -10%, rgba(25,216,230,0.20), transparent 60%),
      radial-gradient(900px 620px at 88% 116%, rgba(123,69,246,0.16), transparent 60%),
      #0B0D22; background: radial-gradient(1200px 640px at 50% -10%, rgba(25,216,230,0.20), transparent 60%),
      radial-gradient(900px 620px at 88% 116%, rgba(123,69,246,0.16), transparent 60%),
      var(--deep); }
  #stage { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center;
    justify-content: center; padding: 24px; box-sizing: border-box; }
  /* A TV crops the edges of the picture — keep the card inside the safe area. */
  @media (min-width: 1280px) { #stage { padding: 5vh 6vw; } }
  video { position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%;
    background: #000; object-fit: contain; }
  .hidden { display: none !important; }

  /* The branded card shared by the connecting + code-entry states. */
  .card { width: 100%; max-width: 430px; text-align: center; padding: 40px 30px;
    border-radius: 30px; background: rgba(255,255,255,0.035);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 40px 90px -34px rgba(0,0,0,0.85), inset 0 1px 0 rgba(255,255,255,0.06);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    animation: rise 0.5s cubic-bezier(0.2,0.8,0.2,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }

  .mark { width: 66px; height: 66px; margin: 0 auto 18px; display: block;
    border-radius: 16px;
    filter: drop-shadow(0 10px 24px rgba(25,216,230,0.38)); }
  .wordmark { font-size: 12px; letter-spacing: 3.5px; text-transform: uppercase;
    color: #AEB7D4; color: var(--muted); font-weight: 700; margin: 0 0 8px; }
  h1 { font-size: 25px; font-weight: 700; letter-spacing: -0.3px; margin: 0 0 6px; }
  .sub { color: #AEB7D4; color: var(--muted); font-size: 15px; margin: 0 0 26px; }

  /* The screen's own code — read from here, typed into the app. Wide letter
     spacing and an unambiguous alphabet so it survives being read across a
     room; monospaced so every glyph occupies the same slot. */
  .screencode {
    margin: 10px 0 4px;
    /* Scales with the viewport so a shrunken two-column card can't push the
       last glyph over the divider; em-based spacing follows the size. */
    font: 700 46px/1.1 ui-monospace, "SF Mono", Menlo, monospace;
    font-size: clamp(30px, 6vw, 46px);
    letter-spacing: 0.22em; text-indent: 0.22em;   /* indent balances the trailing gap */
    color: #19D8E6; color: var(--accent);
    -webkit-user-select: all; user-select: all;
  }

  /* OTP-style code entry: four cells over one hidden input. */
  /* Explicit margins instead of flex `gap` (Chromium 84+) so the spacing
     survives on old TV engines. */
  .otp { position: relative; display: flex; justify-content: center; margin: 4px 0 22px; }
  .cell + .cell { margin-left: 12px; }
  .cell { width: 60px; height: 76px; border-radius: 18px;
    background: rgba(255,255,255,0.04); border: 1.5px solid rgba(255,255,255,0.13);
    display: flex; align-items: center; justify-content: center;
    font: 700 42px/1 ui-monospace, "SF Mono", Menlo, monospace; color: #F4F7FF; color: var(--ink);
    transition: border-color .15s, box-shadow .15s, transform .15s; }
  .cell.filled { border-color: rgba(255,255,255,0.30); }
  .cell.active { border-color: #19D8E6; border-color: var(--accent); transform: translateY(-2px);
    box-shadow: 0 0 0 4px rgba(25,216,230,0.16); }
  .cell.active::after { content: ""; width: 2px; height: 36px; background: #19D8E6; background: var(--accent);
    border-radius: 2px; animation: blink 1.1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #code { position: absolute; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; opacity: 0;
    border: 0; background: transparent; cursor: pointer; }

  .btn { display: inline-flex; align-items: center; justify-content: center;
    width: 100%; height: 54px; border: 0; border-radius: 16px; cursor: pointer;
    font-size: 17px; font-weight: 700; color: #0B0D22; background-image: linear-gradient(135deg, #19E2D3, #268CFF, #7B45F6); background-image: var(--glow);
    box-shadow: 0 14px 32px -12px rgba(38,140,255,0.55);
    transition: transform .1s, filter .15s, opacity .15s; }
  .btn:active { transform: translateY(1px); filter: brightness(0.96); }
  /* Disabled reads as an empty field waiting for input, not as a muddy
     gradient bar: greyscaling one looked like a rendering fault on a TV. */
  .btn:disabled {
    background-image: none; background-color: rgba(255,255,255,0.06);
    color: #AEB7D4; color: var(--muted);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: none; cursor: default; opacity: 1;
  }

  .spinner { width: 44px; height: 44px; margin: 10px auto 18px;
    border: 3.5px solid rgba(25,216,230,0.18); border-top-color: #19D8E6; border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #status { color: #AEB7D4; color: var(--muted); font-size: 14px; margin-top: 14px; min-height: 18px; }
  .signal-error { color: #F05D74; font-size: 13px; line-height: 1.35; margin: 14px 0 0;
    min-height: 18px; }


  /* A fixed, centred stage clips anything taller than the screen — on a phone
     that hid the QR and its instructions with no way to scroll to them. Let the
     stage scroll instead, and centre with auto margins so tall content starts
     at the top rather than losing its head. */
  #stage { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .card { margin: auto; }

  /* The landing has two ways in — type a code, or scan. Stacked on a phone;
     side by side on anything landscape, because a 720p TV clipped the stacked
     version top and bottom and a TV cannot scroll. */
  .entry-col { display: block; }
  .scanhint { max-width: 320px; margin-left: auto; margin-right: auto; }
  .signal-error:empty { display: none; }   /* no error, no reserved gap */
  /* Text-only affordance; shown only where the QR is collapsed (phones). */
  .linkbtn { display: none; margin: 14px auto 0; padding: 8px 4px;
    background: none; border: 0; cursor: pointer;
    font-size: 14px; font-weight: 600; color: #19D8E6; color: var(--accent); }
  @media (min-width: 660px) and (orientation: landscape) {
    /* wrap so the status footer drops below both columns instead of becoming
       a third one beside the QR. */
    #entry { display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap;
      -webkit-align-items: center; align-items: center; text-align: center; max-width: 900px; }
    /* Equal air either side of the line. The divider box begins at #scan's
       left edge and centres its rule, so the right column has to clear a
       further half-box: padding-left = padding-right + box width. */
    /* flex-basis 0 + min-width 0, NOT auto: with auto, the code column's
       preferred width (its widest line of text) could exceed the room left
       beside the QR, and the wrap meant for the status footer swallowed the
       whole scan column — stacked faces wearing the vertical divider
       (observed at 674×612). Basis 0 makes the column shrink instead. */
    .entry-code { flex: 1 1 0; min-width: 0; padding-right: 22px; }
    /* The divider IS the "or" here: a line, the word, a line — running down
       the gap instead of a bare rule with the label hidden. */
    #scan.entry-col {
      position: relative;
      flex: 0 0 auto; padding-left: 64px; border-left: 0;   /* 22 + 42 */
    }
    #scan .scanor {
      display: flex; flex-direction: column; align-items: center;
      position: absolute; left: 0; top: 0; bottom: 0; width: 42px;
      margin: 0; font-size: 11px; letter-spacing: 2px;
    }
    #scan .scanor::before, #scan .scanor::after {
      content: ""; position: static; width: 1px; height: auto;
      flex: 1 1 auto; margin: 10px 0;
      background: rgba(255,255,255,0.12);
    }
  }
  /* Ten-foot read on a TV panel. */
  @media (min-width: 1280px) {
    #entry, #panel { padding: 44px 52px; }
    #entry h1, #panel h1 { font-size: 40px; }
    .sub { font-size: 19px; }
    .cell { width: 76px; height: 96px; font-size: 52px; }
    .btn { font-size: 21px; padding: 18px 30px; }
    #status { font-size: 18px; }
    .mark { width: 84px; height: 84px; }
    .wordmark { font-size: 15px; }
    #qr { width: 220px; height: 220px; }
  }

  /* Reconnect overlay over the frozen video. */
  #reconnect { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: none; align-items: center; justify-content: center;
    background: rgba(11,12,24,0.58); -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); z-index: 15; }
  #reconnect.show { display: flex; }
  #reconnect .rc-box { text-align: center; }
  #reconnect .rc-title { margin-top: 14px; font-size: 18px; font-weight: 700; color: #F4F7FF; color: var(--ink); }
  #reconnect .rc-sub { margin-top: 6px; font-size: 14px; color: #AEB7D4; color: var(--muted); }

  /* Paired senders on the landing: we're listening for their casts. */
  /* This is status, and status the user has already been told once: a screen
     they paired is a screen that stays paired. It gets one quiet line under
     the card's business — no panel, no border, nothing that competes with the
     code or the QR for attention. */
  .codehint { margin: 0 0 18px; }
  /* Full-width footer of the card, below the code column AND the scan column
     (the wide layout wraps it onto its own line). */
  #pairs, .signal-error { -webkit-flex-basis: 100%; flex-basis: 100%; width: 100%; }
  #pairs { margin: 18px 0 0; }
  .pairrow { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center;
    -webkit-justify-content: center; justify-content: center;
    font-size: 12px; color: #AEB7D4; color: var(--muted); }
  .pairrow > * + * { margin-left: 7px; }
  .pairrow .dot { width: 5px; height: 5px; border-radius: 50%; background: #19D8E6; background: var(--accent);
    opacity: 0.85; animation: pulse 1.6s ease-in-out infinite; flex: none; }
  @keyframes pulse { 50% { opacity: 0.2; } }
  .pairrow .name { font-weight: 500; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pairrow .hint { opacity: 0.7; }
  .pairrow .sep { opacity: 0.4; }
  /* A word rather than an ×: it forgets every paired device, which is too
     much to hang off a glyph. Kept at the line's weight so it reads as part
     of the sentence until you go looking for it. */
  .pairrow .forget { flex: none; border: 0; background: transparent; padding: 0;
    color: #AEB7D4; color: var(--muted); font: inherit; text-decoration: underline;
    text-underline-offset: 2px; opacity: 0.75; cursor: pointer; }
  .pairrow .forget:hover { color: #F4F7FF; color: var(--ink); opacity: 1; }
  #scan { margin-top: 22px; }
  .scanor { color: #AEB7D4; color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 2px;
    margin: 0 0 16px; position: relative; }
  .scanor::before, .scanor::after { content: ""; position: absolute; top: 50%; width: 32%;
    height: 1px; background: rgba(255,255,255,0.12); }
  .scanor::before { left: 0; } .scanor::after { right: 0; }
  #qr { width: 180px; height: 180px; margin: 0 auto 16px; padding: 12px; border-radius: 16px;
    background: #fff; box-sizing: border-box; }
  #qr img, #qr canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }

  /* Phones: everything down a size, and the QR to a size that reads as the
     secondary path it is. (Scanning is for a TV screen — on a phone the code
     is the way in.) env() is ignored by engines that lack it, so the plain
     padding above stays the fallback. */
  @media (max-width: 520px) {
    #stage { padding: 16px 14px calc(16px + env(safe-area-inset-bottom)); }
    .card { padding: 26px 20px; border-radius: 24px; }
    .mark { width: 54px; height: 54px; margin-bottom: 14px; }
    .wordmark { font-size: 11px; letter-spacing: 3px; margin-bottom: 12px; }
    h1 { font-size: 22px; }
    .sub { font-size: 14px; max-width: 264px; margin-left: auto; margin-right: auto; }
    .cell { width: 52px; height: 64px; border-radius: 15px; font-size: 34px; }
    .cell + .cell { margin-left: 10px; }
    .otp { margin: 2px 0 18px; }
    .btn { height: 50px; font-size: 16px; }
    /* The QR view has to fit a short phone screen without scrolling: the code
       view is shorter, so this is the size that decides the card. */
    #scan { margin-top: 8px; }
    #scan .scanor { margin: 14px 0 12px; }
    #qr { width: 148px; height: 148px; padding: 9px; margin-bottom: 12px; }
    .scanhint { font-size: 13px; max-width: 252px; margin-bottom: 0; }
    /* A QR is for a camera pointed at ANOTHER screen — on a phone it is the
       rare path, and at 180px tall it crowded out the code entry. Collapsed
       behind one line of text, revealed on demand. */
    /* One at a time on a phone: the code, or the QR that encodes it. */
    #scan { display: none; }
    #entry.showing-qr #scan { display: block; }
    #entry.showing-qr .screencode,
    #entry.showing-qr .codehint,
    #entry.showing-qr .scanor { display: none; }   /* "or" needs two things */
    #scanmore { display: block; }
    .sub { margin-bottom: 20px; }
    .mark { width: 50px; height: 50px; margin-bottom: 12px; }
    #pairs { margin-top: 14px; }
  }

  /* Between the phone cutoff and the two-column threshold (521-659px wide)
     the card is STACKED but got none of the phone's QR-collapse — a full QR
     plus a divider styled for columns it didn't have (the squashed "or").
     Same rule as phones: one face at a time, QR behind a line of text. */
  @media (min-width: 521px) and (max-width: 659px) {
    #scan { display: none; }
    #entry.showing-qr #scan { display: block; }
    #entry.showing-qr .screencode,
    #entry.showing-qr .codehint,
    #entry.showing-qr .scanor { display: none; }
    #scanmore { display: block; }
  }

  /* Landscape phones: two columns already, but the card ran off a 390px-tall
     screen at full size. Everything shrinks rather than anything being cut, so
     the mark and wordmark survive — and the QR stays square because its
     CONTAINER is sized, never the image. Gated on the SAME min-width as the
     two-column layout: without it these divider tweaks hit the stacked card
     (541×440 showed a squashed, off-center "or"). */
  @media (min-width: 660px) and (orientation: landscape) and (max-height: 520px) {
    /* Generous side margins and a capped card: filling a phone's full width
       edge to edge left the two columns stranded far apart, which read as
       stretched rather than roomy. */
    #stage { padding: 14px 34px; }
    #entry, #panel { padding: 18px 24px; max-width: 560px; }
    .mark { width: 40px; height: 40px; margin-bottom: 10px; }
    .wordmark { font-size: 10px; letter-spacing: 2.6px; margin-bottom: 10px; }
    #entry h1, #panel h1 { font-size: 20px; margin-bottom: 4px; }
    /* Let the instruction use the column it has (a 260px cap made it wrap on
       "app."), and give the scan column less so the code column gets more. */
    .sub { font-size: 13px; margin-bottom: 14px; max-width: none; }
    .cell { width: 46px; height: 56px; border-radius: 14px; font-size: 30px; }
    .cell + .cell { margin-left: 9px; }
    .otp { margin: 2px 0 14px; }
    .btn { height: 42px; font-size: 15px; }
    /* Columns closer together, and the button sized to its label instead of
       spanning the whole column. */
    /* A phone in landscape has far less width to give away: a narrower
       divider box, the same equal-gap arithmetic (12 + 32), and shorter line
       segments so the rule does not crowd the label in a short card. */
    .entry-code { padding-right: 12px; }
    #scan.entry-col { padding-left: 44px; }
    #scan .scanor { width: 32px; font-size: 10px; letter-spacing: 1.5px; }
    #scan .scanor::before, #scan .scanor::after { margin: 7px 0; }
    .btn { max-width: 230px; margin-left: auto; margin-right: auto; }
    #qr { width: 124px; height: 124px; padding: 8px; margin-bottom: 8px; }
    .scanhint { font-size: 12px; max-width: 196px; margin-bottom: 0; }
    .spinner { width: 34px; height: 34px; margin: 6px auto 12px; }
  }
</style>
</head>
<body>
  <!-- Shared logo gradient (cyan → azure → violet), referenced by both marks. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19E2D3"/><stop offset="0.5" stop-color="#268CFF"/><stop offset="1" stop-color="#7B45F6"/>
    </linearGradient>
  </defs></svg>

  <!-- Which build this page is — 28% white in a corner, invisible until you
       look for it. Same value rides the hello into the sender's log. -->
  <div style="position:fixed;right:10px;bottom:8px;font-size:10px;letter-spacing:0.5px;
              color:rgba(244,247,255,0.28);z-index:5;pointer-events:none"
       id="receiver-version"></div>

  <div id="stage">
    <video id="v" class="hidden" playsinline controls></video>

    <!-- Reconnect overlay: sits OVER the (frozen) video during a drop, so the
         last frame stays visible instead of falling back to a card. -->
    <div id="reconnect">
      <div class="rc-box">
        <div class="spinner"></div>
        <div class="rc-title">Reconnecting…</div>
        <div id="rc-sub" class="rc-sub"></div>
      </div>
    </div>

    <!-- Connecting / status. This text is the PRE-SCRIPT state: nothing has been
         reached yet, and on a bare visit the script replaces this card with the
         code screen within a beat. It used to read "Connecting… / Reaching the
         sender" — a claim that was false until something actually connected, and
         actively misleading when the script never ran at all (a parse error on an
         old TV engine): the card sat there looking like a live attempt, which is
         indistinguishable from a hung connection. Say only what is true before
         any code runs. Every real state overwrites it, and the boot reporter
         above replaces it with the actual error. -->
    <div id="panel" class="card">
      <img class="mark" src="icon.png" alt="">
      <p class="wordmark">Portage</p>
      <div class="spinner"></div>
      <h1 id="boot-title">Starting…</h1>
      <div id="status">Getting the receiver ready</div>
    </div>

    <!-- This screen's code. Typing happens in the app, on a device with a
         keyboard — a TV remote is the worst possible place to enter one. -->
    <div id="entry" class="card hidden">
      <div class="entry-col entry-code">
      <img class="mark" src="icon.png" alt="">
      <p class="wordmark">Portage</p>
      <h1>Ready to cast</h1>
      <p id="screencode" class="screencode">······</p>
      <p class="sub codehint">Enter this code in Portage</p>
      </div>
      <div id="scan" class="entry-col hidden">
        <p class="scanor">or</p>
        <div id="qr" aria-label="Pairing QR code"></div>
        <p class="sub scanhint">Scan this with the Portage app to connect this screen — no typing at all.</p>
      </div>
      <!-- Status, not part of either face: it belongs UNDER whichever one is
           showing. Inside the code column it ended up above the QR whenever
           the phone swapped faces. -->
      <div id="pairs" class="hidden"></div>
      <div id="signal-error" class="signal-error" role="status" aria-live="polite"></div>
      <!-- Sits after both faces so the action is always under what it swaps,
           never floating above it. Phones only: the wide layout shows both. -->
      <button id="scanmore" class="linkbtn hidden">Show a QR code instead</button>
    </div>
  </div>

<!-- Boot error reporter. FIRST script on the page, deliberately tiny and plain
     ES5, because it is the only thing still running when a later script fails
     to PARSE — one ES2015+ token is fatal on a 2017 TV, and a parse error kills
     that whole script before any of its own error handling exists. Without this
     the receiver sits on its start-up card forever and the only way to find out
     why is a console the TV does not give you. Reports until the main script
     finishes initialising (PLEXCAST_BOOTED); after that the receiver's own
     error handling owns the screen, so a stray late error can't wipe playback. -->
<script>
(function () {
  var missing = [], reported = false;
  function report(headline, detail) {
    if (window.PLEXCAST_BOOTED) return;   // booted — not ours to draw over
    reported = true;
    try {
      window.PLEXCAST_BOOT_ERROR = headline + ": " + detail;   // observable for QA
      var title = document.getElementById("boot-title");
      var status = document.getElementById("status");
      var spinner = document.querySelector("#panel .spinner");
      if (title) title.textContent = headline;
      if (status) status.textContent = String(detail).slice(0, 300);
      if (spinner) spinner.style.display = "none";
    } catch (e) {}
  }
  // Capture phase: a file that 404s fires a non-bubbling error AT its element.
  window.addEventListener("error", function (e) {
    var el = e && e.target;
    if (el && el !== window && (el.src || el.href)) {
      // A file that didn't load is NOT necessarily fatal — the icon is
      // decoration, and hls.js and the QR library are both optional (the page
      // guards for their absence). Remember it; the watchdog below names it
      // only if start-up never actually completes.
      missing.push(String(el.src || el.href).split("/").pop());
      return;
    }
    var where = e && e.filename
      ? " (" + String(e.filename).split("/").pop() + ":" + (e.lineno || 0) + ")" : "";
    report("The receiver hit an error", ((e && e.message) || "script error") + where);
  }, true);
  window.onunhandledrejection = function (e) {
    report("The receiver hit an error", "unhandled: " + ((e && e.reason) || "?"));
  };
  // Nothing above fires for a script that merely never finishes, so the last
  // resort is a watchdog: if initialisation hasn't completed, say that plainly
  // instead of spinning forever. Start-up does no network work of its own, so
  // reaching this means something is genuinely wrong.
  setTimeout(function () {
    if (reported) return;   // a specific error already named the cause — keep it
    report("The receiver didn’t start",
           missing.length ? "couldn’t load " + missing.join(", ")
                          : "the page loaded but its script did not run");
  }, 8000);
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<!-- mp4box.js: demuxes a multi-audio direct MP4 so the MSE engine can switch
     audio without reloading video (the same lib the Chromecast receiver uses,
     vendored locally so the receiver has no runtime CDN dependency for it). -->
<!-- Runtime polyfills for 2017-era TV engines, shared with the LAN receiver.
     MUST load before mp4box: they are installed non-enumerably, because a
     plain assignment leaks into for-in loops and mp4box walks arrays that way
     (it read our Array.prototype helpers as sample groups and crashed).

     ?v= on every one of these, matching RECEIVER_VERSION below, and
     build-hosted-receiver.sh FAILS if they ever disagree. Without it a browser
     serves a cached engine under a fresh page: a run logged "receiver version
     2026-08-13.12" while executing the .11 engine, which sent me chasing a
     performance result the deployed code could not have produced. A version
     that doesn't prove which code ran is worse than none. -->
<script src="tv-polyfills.js?v=2026-08-24.18"></script>
<script src="mp4box.all.min.js?v=2026-08-24.18"></script>
<!-- The MSE engine, shared verbatim with the LAN receiver: hand-built init
     segments, keyframe-cut fragments, per-SourceBuffer mfhd sequences. -->
<script src="tv-mse.js?v=2026-08-24.18"></script>
<script src="mkv-engine.js?v=2026-08-24.18"></script>
<script>
(function () {
  "use strict";
  window.PLEXCAST_VERSION = 19;   // bump when debugging cached-page confusion
  /* ES5 query parsing on purpose: URLSearchParams is Chrome 49+ and this is
     the first executable line on a 2017 TV — a TypeError here would blank the
     whole receiver. */
  function param(name) {
    var source = String(location.search || '') + '&' + String(location.hash || '').replace(/^#/, '');
    var found = new RegExp('(?:[?&#]|^)' + name + '=([^&#]*)').exec(source);
    return found ? decodeURIComponent(found[1].replace(/\+/g, ' ')) : '';
  }
  var qs = { get: function (name) { return param(name) || null; } };
  // sig = signalling mailbox; defaults to the app's built-in Worker so a plain
  // link (page + #code) needs no query. room = the short code from the hash,
  // ?room, or typed into the landing form.
  var sig = (qs.get("sig") || "https://plexcast-signal.rikard-wissing.workers.dev").replace(/\/+$/, "");
  var room = (qs.get("room") || location.hash.replace(/^#/, "")).trim();

  var v = document.getElementById("v");
  var panel = document.getElementById("panel");
  var entry = document.getElementById("entry");
  var statusEl = document.getElementById("status");

  // ---- Shared connect state ---------------------------------------------------
  // Declared ABOVE the code-entry landing's early return: the landing path uses
  // these too (its paired listener answers offers), and `var` hoisting would
  // otherwise leave them undefined there — a silently-swallowed TypeError.
  var dc = null;
  // The sender's load generation for the media currently loaded — echoed in
  // status so the sender can discard a stale (previous-load) report.
  var currentGen = 0;
  // Who we're connected to — replaced by the sender's "hi" (device name).
  var sender = "the sender";
  // A channel opened at least once — turns later failures from "can't traverse
  // NAT" advice into "lost the sender".
  var wasConnected = false;
  // Set by the landing: puts the page back into paired-listening after a cast
  // ends. Null on code/deep-link sessions.
  var resumeListening = null;
  // Debounce so the data-channel close and the connection-failed event (both
  // fire on a drop) only tear down once.
  var disconnecting = false;
  // Reconnect state. A live cast that drops (STUN-only + gatherOnce is fragile
  // to NAT rebinding / Wi-Fi blips, or the sender briefly backgrounding) keeps
  // its FROZEN last frame on screen under a "Reconnecting…" overlay — the video
  // is never torn down — and re-runs the handshake on the same room (the sender
  // keeps its offer re-armed) for up to RECONNECT_WINDOW_MS before giving up.
  // Playback resumes where it left off (the sender re-sends its load at the last
  // reported position).
  var reconnecting = false;
  var reconnectGen = 0;   // bumped per drop; a superseded loop bails
  var RECONNECT_WINDOW_MS = 5 * 60 * 1000;
  // Set when the sender deliberately ends the cast ({t:"stop"}) — then a channel
  // close is expected and we should NOT try to reconnect.
  var stopped = false;
  function nowMs() {
    try { if (window.performance && performance.now) return performance.now(); } catch (e) {}
    return new Date().getTime();
  }
  function handleDrop() {
    if (reconnecting) return;               // one loop owns retries; later drops feed back in
    if (stopped || !room) { giveUp(); return; }
    reconnecting = true;
    var myGen = ++reconnectGen;
    try { v.pause(); } catch (e) {}         // freeze the last frame — do NOT tear the video down
    showReconnect("Lost the connection to " + sender);
    var deadline = nowMs() + RECONNECT_WINDOW_MS;
    var delay = 800;
    /* ES5 retry loop (no async/await — this must parse on a 2017 TV): each
       attempt re-handshakes, and a superseded generation bails out. */
    function finish() {
      if (reconnectGen !== myGen) return;
      reconnecting = false;
      hideReconnect();
      if (!wasConnected) giveUp();          // window expired — the sender is really gone
    }
    function attempt() {
      if (!(reconnecting && reconnectGen === myGen && !stopped && nowMs() < deadline)) { finish(); return; }
      try { if (window.PAGEPC) window.PAGEPC.close(); } catch (e) {}
      rejectAllPending(new Error("connection closed"));
      dc = null;
      wasConnected = false;
      function afterAttempt() {
        if (reconnectGen !== myGen) return; // a newer drop took over
        if (wasConnected) { finish(); return; }   // reconnected — dc.onopen cleared the overlay
        setTimeout(function () {
          if (reconnectGen !== myGen) return;
          delay = Math.min(Math.round(delay * 1.5), 5000);   // back off, capped at 5s
          attempt();
        }, delay);
      }
      try { connect().then(afterAttempt, afterAttempt); }
      catch (e) { afterAttempt(); }
    }
    attempt();
  }
  // Sender stopped on purpose, or reconnection is exhausted — become a castable
  // device again: a paired page goes back to listening, a code/deep-link page
  // reloads bare to the code entry.
  function giveUp() {
    if (resumeListening) resumeListening();
    else location.href = location.pathname;
  }
  // QA trace of the connect state machine (timestamped one-liners).
  /* Bumped on every receiver change — the corner badge and the hello both
     carry it, so "is the TV running the latest?" is answerable at a glance
     (and from the sender's diagnostics log). */
  window.RECEIVER_VERSION = "2026-08-24.18";
  /* Fill the badge HERE, not from an inline script beside the div — that one
     ran before this block defined the version and stamped an empty corner. */
  try { document.getElementById("receiver-version").textContent = window.RECEIVER_VERSION; } catch (e) {}

  // Reload once if this page is stale.
  //
  // The host serves index.html with `Cache-Control: max-age=600` and that is not
  // configurable (GitHub Pages), so a viewer can sit on a ten-minute-old
  // receiver — including one whose bug was just fixed. Worse for diagnosis: the
  // version this page reports to the sender then lands in the phone's log as
  // fact, and it has already sent me chasing a bug in a build that was no
  // longer deployed.
  //
  // So ask the origin what the current version is, bypassing the cache, and
  // reload if it differs. Once per tab (sessionStorage), so a wrong answer can
  // never become a reload loop; the #code fragment survives a reload, so
  // pairing is unaffected.
  (function () {
    if (!window.fetch || !window.sessionStorage) return;
    try { if (sessionStorage.getItem("selfUpdated")) return; } catch (e) { return; }
    fetch(location.pathname + "?probe=" + new Date().getTime(), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.text() : null; })
      .then(function (text) {
        if (!text) return;
        // Built from parts on purpose: the deploy script reads the version out
        // of this file with a `sed` for that exact literal, and a second
        // occurrence here would give it two answers.
        var found = new RegExp("RECEIVER_" + 'VERSION = "([^"]+)"').exec(text);
        if (!found || found[1] === window.RECEIVER_VERSION) return;
        try { sessionStorage.setItem("selfUpdated", found[1]); } catch (e) {}
        location.reload();
      })
      .catch(function () {});
  })();
  window.PLEXCAST_TRACE = [];
  function trace(s) {
    window.PLEXCAST_TRACE.push(Math.round(performance.now()/1000) + "s " + s);
    // Mirror to the sender's diagnostics log over the data channel — the
    // viewer usually has no devtools open when something goes wrong, and the
    // in-page array dies with the tab.
    try {
      if (typeof dc !== "undefined" && dc && dc.readyState === "open") {
        dc.send(JSON.stringify({ t: "trace", message: s }));
      }
    } catch (e) {}
  }
  var h1 = panel.querySelector("h1");

  function setStatus(main, sub) { if (main) h1.textContent = main; if (sub !== undefined) statusEl.textContent = sub; }
  /* The version badge belongs to the idle faces — over video it's clutter. */
  function versionBadge(on) {
    try { document.getElementById("receiver-version").style.display = on ? "" : "none"; } catch (e) {}
  }
  function showVideo() { v.classList.remove("hidden"); panel.classList.add("hidden"); entry.classList.add("hidden"); hideReconnect(); versionBadge(false); }
  function showPanel() { versionBadge(true); v.classList.add("hidden"); panel.classList.remove("hidden"); entry.classList.add("hidden");
    panel.querySelector(".spinner").style.display = ""; }
  // The reconnect overlay sits OVER the video — it does not hide it, so the
  // last frame stays frozen underneath while we re-handshake.
  var reconnectEl = document.getElementById("reconnect");
  function showReconnect(sub) { document.getElementById("rc-sub").textContent = sub || ""; reconnectEl.classList.add("show"); }
  function hideReconnect() { reconnectEl.classList.remove("show"); }
  function fail(msg) { showPanel(); panel.querySelector(".spinner").style.display = "none"; setStatus("Can’t connect", msg); }

  // ---- Durable signalling ---------------------------------------------------
  function sigURL(p) { return (sig || "") + p; }
  function socketURL(p) { return sigURL(p).replace(/^http:/, "ws:").replace(/^https:/, "wss:"); }
  function signalSession() {
    try { return crypto.randomUUID().replace(/-/g, ""); }
    catch (e) { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
  }

  // A room keeps one hibernation-friendly WebSocket open. Cloudflare pushes
  // offers as soon as they exist, so paired TVs remain reachable in background
  // tabs without polling timers or periodic presence writes.
  function SignalSocket(signalRoom, onOffer, onState) {
    this.room = signalRoom;
    this.session = signalSession();
    this.onOffer = onOffer || function () {};
    this.onState = onState || function () {};
    this.socket = null;
    this.closed = false;
    this.ready = false;
    this.retry = 500;
    this.offers = [];
    this.offerWaiters = [];
    this.readyWaiters = [];
    this.open();
  }
  SignalSocket.prototype.open = function () {
    var self = this;
    if (self.closed) return;
    self.onState("Connecting to the signaling service…");
    var ws = new WebSocket(socketURL("/rtc/ws/" + encodeURIComponent(self.room) +
                           "?role=viewer&session=" + encodeURIComponent(self.session)));
    self.socket = ws;
    ws.onmessage = function (event) {
      var message;
      try { message = JSON.parse(event.data); } catch (e) { return; }
      if (message.type === "ready") {
        self.ready = true;
        self.retry = 500;
        self.onState("");
        var waiting = self.readyWaiters.splice(0);
        waiting.forEach(function (pending) { pending.resolve(); });
      } else if (message.type === "offer" && message.sdp && message.generation) {
        var offer = { sdp: message.sdp, generation: message.generation };
        self.offers = [offer];   // only the newest generation can be answered
        var waiter = self.offerWaiters.shift();
        if (waiter) waiter.resolve(self.offers.shift());
        self.onOffer(offer, self);
      } else if (message.type === "error") {
        self.onState(message.message || "The signaling service rejected this connection.");
      }
    };
    ws.onclose = function () {
      if (self.socket !== ws || self.closed) return;
      self.ready = false;
      self.onState("Signaling is unavailable. Retrying…");
      var delay = self.retry;
      self.retry = Math.min(Math.round(self.retry * 1.7), 8000);
      setTimeout(function () { self.open(); }, delay);
    };
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
  };
  SignalSocket.prototype.whenReady = function () {
    var self = this;
    if (self.ready && self.socket && self.socket.readyState === WebSocket.OPEN) return Promise.resolve();
    if (self.closed) return Promise.reject(new Error("signaling closed"));
    return new Promise(function (resolve, reject) {
      self.readyWaiters.push({ resolve: resolve, reject: reject });
    });
  };
  SignalSocket.prototype.waitForOffer = function () {
    var self = this;
    if (self.offers.length) return Promise.resolve(self.offers.shift());
    return new Promise(function (resolve, reject) {
      var pending = { resolve: resolve, reject: reject };
      self.offerWaiters.push(pending);
      setTimeout(function () {
        var i = self.offerWaiters.indexOf(pending);
        if (i >= 0) {
          self.offerWaiters.splice(i, 1);
          reject(new Error("The sender has not published a connection offer yet."));
        }
      }, 20000);
    });
  };
  SignalSocket.prototype.answer = function (generation, sdp) {
    var self = this;
    return self.whenReady().then(function () {
      self.socket.send(JSON.stringify({ type: "answer", generation: generation, sdp: sdp }));
    });
  };
  SignalSocket.prototype.close = function () {
    this.closed = true;
    this.ready = false;
    try { if (this.socket) this.socket.close(1000, "leaving"); } catch (e) {}
    this.offerWaiters.splice(0).forEach(function (waiter) { waiter.reject(new Error("signaling closed")); });
    this.readyWaiters.splice(0).forEach(function (pending) { pending.reject(new Error("signaling closed")); });
  };

  var activeSignal = null;
  var landingSignals = {};
  var signalErrorEl = document.getElementById("signal-error");
  function activeSignalState(message) {
    if (message) {
      if (!entry.classList.contains("hidden")) signalErrorEl.textContent = message;
      else setStatus("Connecting…", message);
    } else {
      signalErrorEl.textContent = "";
    }
  }
  function closeLandingSignals(except) {
    Object.keys(landingSignals).forEach(function (key) {
      if (landingSignals[key] !== except) landingSignals[key].close();
    });
    landingSignals = {};
  }
  window.addEventListener("pagehide", function () {
    closeLandingSignals();
    if (activeSignal) activeSignal.close();
  });

  // ---- Pairing: remember senders so they can cast here without a code -------
  // A pairing is {id, name}: the id is a long token the sender minted; it's
  // also the signaling room a paired cast arrives on. While this page is open
  // one room socket per pairing is both presence and the offer listener.
  var PAIRS_KEY = "plexcast.pairs";
  function loadPairs() {
    try { return JSON.parse(localStorage.getItem(PAIRS_KEY) || "[]"); } catch (e) { return []; }
  }
  function savePairs(list) { try { localStorage.setItem(PAIRS_KEY, JSON.stringify(list)); } catch (e) {} }
  function rememberPair(id, name) {
    if (!id) return;
    var list = loadPairs().filter(function (p) { return p.id !== id; });
    list.unshift({ id: String(id).slice(0, 64), name: String(name || "A device").slice(0, 40) });
    savePairs(list.slice(0, 8));
  }
  function forgetPair(id) { savePairs(loadPairs().filter(function (p) { return p.id !== id; })); }

  // No code in the link → this screen mints its own and shows it. The user
  // types it into the app, which is where a keyboard is; the page never asks
  // anyone to type on a television.
  if (!room) {
    panel.classList.add("hidden");
    entry.classList.remove("hidden");
    versionBadge(true);
    var submitted = false;

    // Six characters from an alphabet with no 0/O, 1/I/L or U — a billion
    // combinations, and nothing that can be misread from across a room.
    var mintScreenCode = function() {
      var alphabet = "23456789ABCDEFGHJKMNPQRSTVWXYZ", out = "";
      var values = new Uint32Array(6);
      try { crypto.getRandomValues(values); }
      catch (e) { for (var j = 0; j < 6; j++) values[j] = Math.floor(Math.random() * 0xFFFFFFFF); }
      for (var i = 0; i < 6; i++) out += alphabet.charAt(values[i] % alphabet.length);
      return out;
    };
    var screenCode = mintScreenCode();
    document.getElementById("screencode").textContent = screenCode;

    // Paired senders: list them and listen — when one starts a cast to us, its
    // offer appears under the pairing token and we connect, no code needed.
    var pairsEl = document.getElementById("pairs");
    /* Known screens are not worth naming here. This page is usually a
       television in a shared room, and printing "Rikard's MacBook Pro" on it
       tells everyone present nothing they need and something they might not
       want shared. All anyone needs to know is that the page is listening —
       and a way to sever it. */
    var renderPairs = function() {
      var pairs = loadPairs();
      pairsEl.classList.toggle("hidden", pairs.length === 0);
      pairsEl.innerHTML = "";
      if (!pairs.length) return;
      var row = document.createElement("div");
      row.className = "pairrow";
      var dot = document.createElement("span"); dot.className = "dot";
      var label = document.createElement("span"); label.className = "name";
      label.textContent = "Listening…";
      var count = document.createElement("span"); count.className = "hint";
      count.textContent = pairs.length === 1 ? "1 known device" : pairs.length + " known devices";
      var forget = document.createElement("button");
      forget.className = "forget"; forget.type = "button";
      forget.textContent = "Forget";
      forget.title = "Forget every device paired with this screen";
      forget.addEventListener("click", function () {
        savePairs([]);
        renderPairs();
        listenLanding();
      });
      // Middots between the facts, so the line reads as one sentence rather
      // than three things that happen to be adjacent.
      function sep() {
        var el = document.createElement("span"); el.className = "sep";
        el.textContent = "·"; return el;
      }
      row.appendChild(dot); row.appendChild(label); row.appendChild(sep());
      row.appendChild(count); row.appendChild(sep()); row.appendChild(forget);
      pairsEl.appendChild(row);
    };
    renderPairs();

    // Reverse pairing: mint a rendezvous code and show it as a QR. The phone
    // scans it (in-app, or the system camera opens the deep link) and casts to
    // this screen — no code typed here. We listen on this room like a pairing token.
    // The QR is the same code, scanned instead of typed.
    var scanRoom = screenCode;
    (function setupScanQR() {
      if (typeof qrcode !== "function") return;   // lib offline → the code still works
      try {
        var qr = qrcode(0, "M");
        qr.addData("portage://pair?r=" + scanRoom);
        qr.make();
        document.getElementById("qr").innerHTML = qr.createImgTag(5, 0);
        document.getElementById("scan").classList.remove("hidden");
      } catch (e) { document.getElementById("scan").classList.add("hidden"); }
    })();

    /* On a phone the card shows one thing at a time and this swaps between
       them — "instead" has to mean instead. Both are the same code, so seeing
       them together is just clutter, and there was no way back. */
    (function () {
      var more = document.getElementById("scanmore");
      if (!more || !scanRoom) return;
      more.classList.remove("hidden");
      more.addEventListener("click", function () {
        var showingQR = entry.classList.toggle("showing-qr");
        more.textContent = showingQR ? "Show the code instead" : "Show a QR code instead";
      });
    })();

    var acceptLandingOffer = function(offer, socket, target) {
      if (submitted) return;
      trace("signal: offer pushed to landing");
      submitted = true;
      activeSignal = socket;
      closeLandingSignals(socket);
      room = target.id;
      showPanel();
      setStatus("Connecting…", "Answering " + target.name);
      start(1);
    };

    var listenLanding = function() {
      closeLandingSignals();
      signalErrorEl.textContent = "";
      var targets = loadPairs().slice();
      if (scanRoom) targets.push({ id: scanRoom, name: "your phone" });
      targets.forEach(function (target) {
        var socket = new SignalSocket(target.id, function (offer, source) {
          acceptLandingOffer(offer, source, target);
        }, activeSignalState);
        landingSignals[target.id] = socket;
      });
    };

    // After a cast ends, come back here and restore the persistent listeners.
    resumeListening = function () {
      submitted = false;
      room = "";
      if (activeSignal) activeSignal.close();
      activeSignal = null;
      panel.classList.add("hidden");
      entry.classList.remove("hidden");
      versionBadge(true);
      renderPairs();
      listenLanding();
    };

    listenLanding();
    // NB: no early return — the whole script (data-channel machinery, the
    // playback stall/error listeners) must still be defined for a
    // session that begins here (typed code or paired listen). submitCode /
    // the listener callback starts itself; the deep-link auto-start at the
    // bottom is guarded on `room`.
  }

  // ---- Signalling offer/answer over the room socket -------------------------
  function getOffer() {
    if (!activeSignal || activeSignal.room !== room) {
      if (activeSignal) activeSignal.close();
      activeSignal = new SignalSocket(room, null, activeSignalState);
    }
    return activeSignal.waitForOffer();
  }
  function postAnswer(blob, generation) {
    if (!activeSignal) return Promise.reject(new Error("Signaling connection closed"));
    return activeSignal.answer(generation, blob);
  }

  // ---- Data-channel request/response ----------------------------------------
  // Requests are JSON {t:"req",id,path,start?,end?}; the phone replies with a
  // JSON {t:"res",id,status,len,ctype} header then binary body chunks (4-byte
  // LE id prefix), an empty-body chunk marking EOF. Multiple requests can be
  // in flight; each is keyed by id.
  // The sender's unsolicited moov for the current load: announced by `initmoov`,
  // filled by `onBody`, consumed by the engine in place of a request.
  var initMoov = null;
  var reqId = 1;
  var pending = {};   // id -> {resolve, reject, meta, chunks, got, timer, channel}
  // This is an INACTIVITY deadline, not a whole-request deadline. Every header
  // and body chunk rearms it, so a slow link may take as long as it needs while
  // a wedged SCTP request cannot strand the MSE pump forever. QA may shorten it.
  var requestIdleOverride = param("requestIdleMs");
  var REQUEST_IDLE_MS = requestIdleOverride && param("qa") === "1"
    ? Math.max(25, Number(requestIdleOverride) || 15000) : 15000;

  function channelReady() { return dc && dc.readyState === "open"; }

  function clearRequestTimer(p) {
    if (p && p.timer) { clearTimeout(p.timer); p.timer = null; }
  }
  function rejectPending(id, error, sendAbort) {
    var p = pending[id];
    if (!p) return;
    delete pending[id];
    clearRequestTimer(p);
    if (sendAbort && p.channel && p.channel.readyState === "open") {
      try { p.channel.send(JSON.stringify({ t: "abort", id: id })); } catch (e) {}
    }
    p.reject(error);
  }
  function rejectAllPending(error) {
    var ids = Object.keys(pending);
    for (var i = 0; i < ids.length; i++) rejectPending(Number(ids[i]), error, false);
  }
  function armRequestTimer(id) {
    var p = pending[id];
    if (!p) return;
    clearRequestTimer(p);
    p.timer = setTimeout(function () {
      if (pending[id] !== p) return;
      trace("request #" + id + " idle for " + REQUEST_IDLE_MS + "ms — recovering channel");
      rejectPending(id, new Error("request made no progress"), true);
      // Closing/re-answering the peer is the only way to recover a data channel
      // that still reports `open` while its SCTP send queue is wedged. A landing
      // page has no room and uses this helper only in QA, so do not navigate it.
      if (room) handleDrop();
    }, REQUEST_IDLE_MS);
  }

  function fetchOverChannel(path, opts) {
    opts = opts || {};
    return new Promise(function (resolve, reject) {
      if (!channelReady()) { reject(new Error("channel closed")); return; }
      var id = reqId++;
      var requestChannel = dc;
      pending[id] = { resolve: resolve, reject: reject, meta: null, chunks: [], got: 0,
                      timer: null, channel: requestChannel };
      if (opts.onId) opts.onId(id);
      var msg = { t: "req", id: id, path: path };
      if (opts.start != null) msg.start = opts.start;
      if (opts.end != null) msg.end = opts.end;
      armRequestTimer(id);
      try { requestChannel.send(JSON.stringify(msg)); }
      catch (e) { rejectPending(id, e, false); }
    });
  }

  // hls.js aborts the in-flight fragment on every seek; tell the phone so it
  // stops streaming bytes we no longer want and can serve the new fragment now.
  function cancelRequest(id) {
    if (id == null) return;
    rejectPending(id, new Error("request cancelled"), true);
  }

  // Find the hls.js audio/subtitle track whose rendition encodes the app
  // typeIndex — the package names them audio<N>.m3u8 / sub<N>.m3u8. A digit
  // boundary keeps "1" from matching "12"; checks the resolved url and the raw
  // manifest URI (hls.js exposes both).
  function renditionIndex(tracks, kind, typeIndex) {
    tracks = tracks || [];

        undefined — so the two race and createAnswer can hand setLocalDescription

  }
  /* A raw candidate count hides the thing that matters to an old engine: WHAT
     the addresses are. Chrome obfuscates host candidates as "<uuid>.local" mDNS
     names and resolves them itself; Chromium 38 has no mDNS resolver, so every
     such candidate is dead weight to it — and IPv6 is useless on an IPv4-only
     network. Either can leave the agent with nothing to check, which looks
     exactly like "checking with 0 requests sent". */
  function candidateBreakdown(sdp) {
    var lines = String(sdp).match(/^a=candidate:[^\r\n]*/gm) || [];
    var byType = {}, mdns = 0, v6 = 0, usable = 0;
    for (var i = 0; i < lines.length; i++) {
      var parts = /^a=candidate:\S+ \d+ (\S+) \d+ (\S+) \d+ typ (\w+)/.exec(lines[i]);
      if (!parts) continue;
      var address = parts[2], kind = parts[3];
      byType[kind] = (byType[kind] || 0) + 1;
      if (/\.local$/i.test(address)) mdns++;
      else if (address.indexOf(":") >= 0) v6++;
      else usable++;
    }
    var out = [], kind;
    for (kind in byType) out.push(kind + " " + byType[kind]);
    return out.join(" ") + " · mdns " + mdns + " · v6 " + v6 + " · plain-v4 " + usable;
  }
  /* The sender's routable IPv4 addresses, so the two LAN subnets can be
     compared by eye. Same public IP says both sit behind one router; it does
     NOT say they share a subnet, and a wired TV on one VLAN with the phone on
     another cannot reach it directly while every other device happily can. */
  function theirV4(sdp) {
    var lines = String(sdp).match(/^a=candidate:[^\r\n]*/gm) || [], out = [];
    for (var i = 0; i < lines.length && out.length < 4; i++) {
      var parts = /^a=candidate:\S+ \d+ \S+ \d+ (\S+) \d+ typ (\w+)/.exec(lines[i]);
      if (!parts || parts[1].indexOf(":") >= 0) continue;
      if (out.join(",").indexOf(parts[1]) < 0) out.push(parts[1]);
    }
    return out.join(",");
  }
  function describeSdp(sdp) {
    if (!sdp) return "none";
    var d = sdpDigest(sdp);
    return d.proto + " mid:" + d.mid + " grp:" + d.group + " " + d.sctp + " ice-" + d.ice;
  }
  function alignAnswerToOffer(answerSdp, offerSdp) {
    var text = modernSdpForSender(answerSdp);
    var offered = sdpDigest(offerSdp), ours = sdpDigest(text);
    if (offered.mid !== "?" && ours.mid !== "?" && offered.mid !== ours.mid) {
      text = text.replace(/^a=mid:[^\r\n]*$/m, "a=mid:" + offered.mid);
      if (ours.group !== "?") {
        text = text.replace(/^a=group:BUNDLE[^\r\n]*$/m, "a=group:BUNDLE " + offered.mid);
      }
    }
    return text;
  }
  function wait(ms) { return new Promise(function (res) { setTimeout(res, ms); }); }

  function connect() {
    disconnecting = false;   // fresh attempt — arm the drop handler again
    // Filled in as the handshake proceeds so a failure can describe itself on
    // screen (see handshakeSummary, assigned once the peer exists).
    var remoteCandidates = 0, sentCandidates = -1, usedLegacyOffer = false;
    var myPublic = {}, theirPublic = {};
    var offerSdp = "", answerSdp = "";
    var offerAt = 0, answerAt = 0;   // the sender re-arms 15s after it takes an answer
    var handshakeSummary = function () { return "never started"; };
    if (!PeerCtor) {
      fail("This browser has no WebRTC support.");
      return Promise.reject(new Error("no RTCPeerConnection"));
    }
    var pc;
    try { pc = new PeerCtor(iceConfig()); }
    catch (e) {
      fail("This browser could not open a WebRTC connection.");
      return Promise.reject(e);
    }
    pc.ondatachannel = function (e) {
      dc = e.channel;
      dc.binaryType = "arraybuffer";
      dc.onmessage = function (ev) {
        if (typeof ev.data === "string") { try { onControl(JSON.parse(ev.data)); } catch (x) {} }
        else onBody(ev.data);
      };
      dc.onopen = function () {
        wasConnected = true;
        reconnecting = false;   // reconnected — stop the loop and drop the overlay now
        hideReconnect();
        panel.querySelector(".spinner").style.display = "none";
        setStatus("Ready to cast", "Choose something to play in " + sender);
        // The hello carries the pairing tokens this browser holds, so a sender
        // that already knows one recognises us and reuses it — connecting with
        // a fresh code doesn't create a duplicate pairing on either end.
        try {
          dc.send(JSON.stringify({ t: "hello", label: viewerLabel(),
                                   v: window.RECEIVER_VERSION,
                                   pairings: loadPairs().map(function (p) { return p.id; }) }));
        } catch (x) {}
      };
      dc.onclose = function () { handleDrop(); };
    };
    window.PAGEPC = pc;   // QA observable
    /* A television has no console, so when the handshake fails the page has to
       be able to SAY where it stopped. These three facts separate the causes
       that otherwise all look like "it just doesn't connect": no candidates of
       our own means the engine never gathered; none from the sender means its
       offer arrived empty; and the ICE state we reached distinguishes "never
       paired" (new) from "paired but no path" (checking) from "path found, so a
       failure after this is DTLS or the data channel" (connected). */
    var iceSeen = [], myCandidates = {}, myAddresses = [];
    pc.onicecandidate = function (e) {
      if (!e || !e.candidate) return;
      var line = e.candidate.candidate || "";
      var found = /(?:^| )typ (\w+)/.exec(line);
      var kind = found ? found[1] : "?";
      myCandidates[kind] = (myCandidates[kind] || 0) + 1;
      var address = publicAddressOf(line);
      if (address) myPublic[address] = true;
      var seen = /^candidate:\S+ \d+ \S+ \d+ (\S+) /.exec(line.replace(/^a=/, ""));
      if (seen && seen[1].indexOf(":") < 0 && myAddresses.join(",").indexOf(seen[1]) < 0) {
        myAddresses.push(seen[1]);   // IPv4 only; the subnet is the point
      }
    };
    handshakeSummary = function () {
      var mine = [], kind;
      for (kind in myCandidates) mine.push(kind + " " + myCandidates[kind]);
      return "ice " + (iceSeen.join("→") || pc.iceConnectionState || "none") +
             " · mine " + (mine.join(", ") || "none") +
             " · sent " + (sentCandidates < 0 ? "?" : sentCandidates) +
             " · mine-ip " + (myAddresses.join(",") || "?") +
             " · theirs " + remoteCandidates + " [" + candidateBreakdown(offerSdp) + "]" +
             " · theirs-v4 " + (theirV4(offerSdp) || "?") +
             " · t " + ((offerAt && answerAt) ? Math.round(answerAt - offerAt) + "ms" : "?") +
             " · sdp " + (usedLegacyOffer ? "legacy" : "modern") +
             " · " + sameNetworkVerdict(myPublic, theirPublic) +
             // The actual shapes, because reasoning about what this engine
             // "should" emit has been wrong twice now.
             " | ans " + describeSdp(answerSdp) + " | off " + describeSdp(offerSdp);
    };
    window.PLEXCAST_ICE_LOG = window.PLEXCAST_ICE_LOG || [];
    pc.oniceconnectionstatechange = function () {
      window.PLEXCAST_ICE_LOG.push(nowMs() % 100000 + " ice:" + pc.iceConnectionState);
      if (iceSeen[iceSeen.length - 1] !== pc.iceConnectionState) iceSeen.push(pc.iceConnectionState);
      trace("ice " + pc.iceConnectionState);
    };
    // connectionState is Chrome 72+; on older engines this never fires and a
    // dead link surfaces through the ice state / channel close instead.
    pc.onconnectionstatechange = function () {
      window.PLEXCAST_ICE_LOG.push(nowMs() % 100000 + " conn:" + pc.connectionState);
      if (pc.connectionState !== "failed") return;
      // Failing BEFORE a channel ever opened is a NAT-traversal problem; failing
      // after means the sender vanished (app quit, network drop) — go back to
      // listening so we're castable again.
      if (wasConnected) handleDrop();
      else fail("Couldn’t establish a direct connection (this network may need TURN).");
    };

    setStatus("Connecting…", "Fetching connection info");
    var signalOffer = null;
    return getOffer().then(function (offer) {
      signalOffer = offer;
      offerAt = nowMs();
      trace("getOffer ok len=" + offer.sdp.length);
      var parsed = decode(offer.sdp);
      // Strip attributes an old parser cannot read BEFORE the first attempt, so
      // the DTLS/SCTP retry below inherits a description that at least parses.
      parsed.sdp = sdpForOldParsers(parsed.sdp);
      // The offer is non-trickle, so the sender's candidates ride inside it.
      // Zero here means there is nothing to connect TO, which is a sender-side
      // fault and worth telling apart from our own gathering failing.
      offerSdp = String(parsed.sdp);   // kept so the answer can be aligned to it
      var theirLines = String(parsed.sdp).match(/^a=candidate:[^\r\n]*/gm) || [];
      remoteCandidates = theirLines.length;
      theirLines.forEach(function (line) {
        var address = publicAddressOf(line);
        if (address) theirPublic[address] = true;
      });
      return sdpCall(pc, "setRemoteDescription", describe(parsed)).catch(function (e) {
        var rewritten = legacySdp(parsed.sdp);
        if (rewritten === parsed.sdp) throw e;
        usedLegacyOffer = true;   // ...so the answer must be translated back (see modernSdpForSender)
        trace("setRemoteDescription failed (" + (e && e.message || e) + ") — retrying with legacy DTLS/SCTP");
        return sdpCall(pc, "setRemoteDescription", describe({ type: parsed.type, sdp: rewritten }));
      });
    }).then(function () {
      return sdpCall(pc, "createAnswer", null);
    }).then(function (answer) {
      return sdpCall(pc, "setLocalDescription", answer);
    }).then(function () {
      // Non-trickle: wait for ICE gathering to finish so the answer is complete.
      return new Promise(function (res) {
        if (pc.iceGatheringState === "complete") { res(); return; }
        var t = setTimeout(res, 4000);
        pc.onicegatheringstatechange = function () {
          if (pc.iceGatheringState === "complete") { clearTimeout(t); res(); }
        };
      });
    }).then(function () {
      setStatus("Connecting…", "Handing back the answer");
      // What the sender actually receives. Gathering is capped at 4s above, so
      // a slow engine can post an answer carrying fewer candidates than it
      // eventually finds — counting at failure time would hide that.
      var localSdp = (pc.localDescription && pc.localDescription.sdp) || "";
      sentCandidates = (localSdp.match(/^a=candidate:/gm) || []).length;
      // Answer in the profile that was OFFERED, not the one this engine speaks,
      // and agreeing with it on the mid/BUNDLE token as well as the m= proto.
      answerSdp = alignAnswerToOffer(localSdp, offerSdp);
      if (answerSdp !== localSdp) trace("answer realigned to the offer before posting");
      return postAnswer(encode({ type: (pc.localDescription && pc.localDescription.type) || "answer",
                                 sdp: answerSdp }), signalOffer.generation);
    }).then(function () {
      answerAt = nowMs();
      trace("answer posted for room " + room.slice(0, 8) +
            " after " + Math.round(answerAt - offerAt) + "ms");
      // Give ICE its normal connection window. The sender acknowledges and clears
      // the generation over its own socket; if ICE still does not open, its
      // handshake watchdog publishes a fresh generation and this socket receives
      // it without polling.
      return wait(12000);
    }).then(function () {
      if (wasConnected) return;
      return new Promise(function (res) {
        iceStatsSummary(pc, function (text, facts) { res({ text: text, facts: facts || {} }); });
      }).then(function (result) {
        var stats = result.text, facts = result.facts;
        /* Reaching each other and then failing is not a network problem, and
           saying "couldn't connect" for it sends people to the router. A pair
           that went writable means ICE succeeded; no DTLS cipher after that
           means the secure handshake did not. On a 2017 TV that is a version
           floor, not a fault: this engine offers DTLS 1.0 and the sender's
           libwebrtc dropped everything below 1.2, so nothing either end can be
           told will make them agree. Name it, and point at the path that works. */
        if (facts.writable && !facts.dtls) {
          fail("This TV reached the sender, but its browser is too old to finish the " +
               "secure handshake (it offers DTLS 1.0; the sender needs 1.2 or newer). " +
               "Cast to this TV over the phone's own Wi-Fi receiver instead.");
          throw { handled: true, why: stats };
        }
        var why = handshakeSummary() + " | " + stats;
        trace("retry: answer sent but ICE never connected — " + why);
        try { pc.close(); } catch (x) {}
        dc = null;
        throw { retry: true, why: why };
      });
    });
  }

  /* "[object Object]" is all String() can make of the {retry:true} sentinel, and
     that is exactly what the screen showed after four attempts — a dead end for
     anyone trying to work out what went wrong. Prefer the handshake summary the
     sentinel now carries, then a real Error's message, and never fall through to
     a bare object again. */
  function describeFailure(e) {
    if (!e) return "unknown error";
    if (typeof e === "string") return e;
    if (e.why) return "the connection never opened — " + e.why;
    if (e.message) return String(e.message);
    try {
      var text = JSON.stringify(e);
      if (text && text !== "{}") return text;
    } catch (x) {}
    return String(e);
  }

  function start(attempt) {
    // connect() does real work — constructing the peer, reading its
    // capabilities — BEFORE it returns a promise, and on an old engine any of
    // that can throw SYNCHRONOUSLY. Calling .catch() straight off the call
    // meant such a throw escaped before a handler was ever attached: nothing
    // reported it, fail() never ran, and the card sat on its start-up text
    // looking like a connection that was merely slow. Normalise to a promise so
    // every failure, sync or async, lands on the same "Can't connect".
    var attempted;
    try { attempted = connect(); } catch (e) { attempted = Promise.reject(e); }
    attempted.catch(function (e) {
      if (e && e.handled) return;   // already explained on screen
      if (e && e.retry && attempt < 4) {
        setStatus("Connecting…", "Trying again…");
        start(attempt + 1);
      } else {
        fail(describeFailure(e));
      }
    });
  }
  // A deep link (#code / ?room=) connects straight away; a landing session
  // (typed code or paired listen) starts itself once it has a room.
  if (room) start(1);
  // Initialisation finished. From here the receiver's own error handling owns
  // the screen, so the boot reporter stands down (see the top of the page) —
  // otherwise a stray late error would wipe out live playback with an error card.
  window.PLEXCAST_BOOTED = true;
})();
</script>
</body>
