<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="icon.png">
  <title>Plex Downloader</title>
<style>
  :root {
    color-scheme: dark;
    --accent: #F59E42;   /* warm amber — the app's primary */
    --coral:  #E85E52;   /* glow gradient partner */
    --violet: #9E78F0;   /* conversion family */
    --deep:   #16172B;   /* deep indigo surface */
    --ink:    #ECEAF3;
    --muted:  #9095AD;
    --glow: linear-gradient(135deg, var(--accent), var(--coral));
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; color: #ECEAF3; color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; }
  /* "Projector in a dark room": warm amber light on deep indigo. */
  body { background: radial-gradient(1200px 640px at 50% -10%, rgba(245,158,66,0.20), transparent 60%),
      radial-gradient(900px 620px at 88% 116%, rgba(158,120,240,0.16), transparent 60%),
      #16172B; background: radial-gradient(1200px 640px at 50% -10%, rgba(245,158,66,0.20), transparent 60%),
      radial-gradient(900px 620px at 88% 116%, rgba(158,120,240,0.16), transparent 60%),
      var(--deep); }
  #stage { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center;
    justify-content: center; padding: 24px; box-sizing: border-box; }
  /* A TV crops the edges of the picture — keep the card inside the safe area. */
  @media (min-width: 1280px) { #stage { padding: 5vh 6vw; } }
  video { position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%;
    background: #000; object-fit: contain; }
  .hidden { display: none !important; }

  /* The branded card shared by the connecting + code-entry states. */
  .card { width: 100%; max-width: 430px; text-align: center; padding: 40px 30px;
    border-radius: 30px; background: rgba(255,255,255,0.035);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 40px 90px -34px rgba(0,0,0,0.85), inset 0 1px 0 rgba(255,255,255,0.06);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    animation: rise 0.5s cubic-bezier(0.2,0.8,0.2,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }

  .mark { width: 66px; height: 66px; margin: 0 auto 18px; display: block;
    border-radius: 16px;
    filter: drop-shadow(0 10px 24px rgba(245,158,66,0.38)); }
  .wordmark { font-size: 12px; letter-spacing: 3.5px; text-transform: uppercase;
    color: #9095AD; color: var(--muted); font-weight: 700; margin: 0 0 8px; }
  h1 { font-size: 25px; font-weight: 700; letter-spacing: -0.3px; margin: 0 0 6px; }
  .sub { color: #9095AD; color: var(--muted); font-size: 15px; margin: 0 0 26px; }

  /* OTP-style code entry: four cells over one hidden input. */
  /* Explicit margins instead of flex `gap` (Chromium 84+) so the spacing
     survives on old TV engines. */
  .otp { position: relative; display: flex; justify-content: center; margin: 4px 0 22px; }
  .cell + .cell { margin-left: 12px; }
  .cell { width: 60px; height: 76px; border-radius: 18px;
    background: rgba(255,255,255,0.04); border: 1.5px solid rgba(255,255,255,0.13);
    display: flex; align-items: center; justify-content: center;
    font: 700 42px/1 ui-monospace, "SF Mono", Menlo, monospace; color: #ECEAF3; color: var(--ink);
    transition: border-color .15s, box-shadow .15s, transform .15s; }
  .cell.filled { border-color: rgba(255,255,255,0.30); }
  .cell.active { border-color: #F59E42; border-color: var(--accent); transform: translateY(-2px);
    box-shadow: 0 0 0 4px rgba(245,158,66,0.16); }
  .cell.active::after { content: ""; width: 2px; height: 36px; background: #F59E42; background: var(--accent);
    border-radius: 2px; animation: blink 1.1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #code { position: absolute; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; opacity: 0;
    border: 0; background: transparent; cursor: pointer; }

  .btn { display: inline-flex; align-items: center; justify-content: center;
    width: 100%; height: 54px; border: 0; border-radius: 16px; cursor: pointer;
    font-size: 17px; font-weight: 700; color: #2A1305; background-image: linear-gradient(135deg, #F59E42, #E85E52); background-image: var(--glow);
    box-shadow: 0 14px 32px -12px rgba(245,158,66,0.65);
    transition: transform .1s, filter .15s, opacity .15s; }
  .btn:active { transform: translateY(1px); filter: brightness(0.96); }
  /* Disabled reads as an empty field waiting for input, not as a muddy amber
     bar: greyscaling a gradient looked like a rendering fault on a TV. */
  .btn:disabled {
    background-image: none; background-color: rgba(255,255,255,0.06);
    color: #9095AD; color: var(--muted);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: none; cursor: default; opacity: 1;
  }

  .spinner { width: 44px; height: 44px; margin: 10px auto 18px;
    border: 3.5px solid rgba(245,158,66,0.18); border-top-color: #F59E42; border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #status { color: #9095AD; color: var(--muted); font-size: 14px; margin-top: 14px; min-height: 18px; }
  .signal-error { color: #ff8d86; font-size: 13px; line-height: 1.35; margin: 14px 0 0;
    min-height: 18px; }


  /* The landing has two ways in — type a code, or scan. Stacked on a phone;
     side by side on anything landscape, because a 720p TV clipped the stacked
     version top and bottom and a TV cannot scroll. */
  .entry-col { display: block; }
  #entry { max-height: 90vh; }
  #qr img { display: block; margin: 0 auto; width: auto; height: auto; max-width: 100%; max-height: 26vh; }
  .scanhint { max-width: 320px; margin-left: auto; margin-right: auto; }
  @media (min-width: 820px) and (orientation: landscape) {
    #entry { display: flex; align-items: center; text-align: center; max-width: 900px; }
    .entry-code { flex: 1 1 auto; padding-right: 40px; }
    #scan.entry-col {
      flex: 0 0 auto; padding-left: 40px;
      border-left: 1px solid rgba(255,255,255,0.08);
    }
    #scan .scanor { display: none; }        /* the divider says it now */
  }
  /* Ten-foot read on a TV panel. */
  @media (min-width: 1280px) {
    #entry, #panel { padding: 44px 52px; }
    #entry h1, #panel h1 { font-size: 40px; }
    .sub { font-size: 19px; }
    .cell { width: 76px; height: 96px; font-size: 52px; }
    .btn { font-size: 21px; padding: 18px 30px; }
    #status { font-size: 18px; }
    .mark { width: 84px; height: 84px; }
    .wordmark { font-size: 15px; }
    #qr img { max-height: 30vh; }
  }

  /* Reconnect overlay over the frozen video. */
  #reconnect { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: none; align-items: center; justify-content: center;
    background: rgba(11,12,24,0.58); -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); z-index: 15; }
  #reconnect.show { display: flex; }
  #reconnect .rc-box { text-align: center; }
  #reconnect .rc-title { margin-top: 14px; font-size: 18px; font-weight: 700; color: #ECEAF3; color: var(--ink); }
  #reconnect .rc-sub { margin-top: 6px; font-size: 14px; color: #9095AD; color: var(--muted); }

  /* Paired senders on the landing: we're listening for their casts. */
  #pairs { margin: -8px 0 22px; text-align: left; }
  #pairs .pairhead { font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
    color: #9095AD; color: var(--muted); font-weight: 700; margin: 0 0 8px; text-align: center; }
  .pairrow { display: flex; align-items: center; padding: 10px 14px;
    border-radius: 14px; background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.08); margin-bottom: 8px; }
  .pairrow > * + * { margin-left: 10px; }
  .pairrow .dot { width: 8px; height: 8px; border-radius: 50%; background: #F59E42; background: var(--accent);
    animation: pulse 1.6s ease-in-out infinite; flex: none; }
  @keyframes pulse { 50% { opacity: 0.25; } }
  .pairrow .name { flex: 1; font-size: 15px; font-weight: 600; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pairrow .hint { color: #9095AD; color: var(--muted); font-size: 12px; flex: none; }
  .pairrow .forget { flex: none; border: 0; background: transparent; color: #9095AD; color: var(--muted);
    font-size: 17px; cursor: pointer; padding: 2px 6px; border-radius: 8px; }
  .pairrow .forget:hover { color: #ECEAF3; color: var(--ink); background: rgba(255,255,255,0.08); }
  #scan { margin-top: 22px; }
  .scanor { color: #9095AD; color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 2px;
    margin: 0 0 16px; position: relative; }
  .scanor::before, .scanor::after { content: ""; position: absolute; top: 50%; width: 32%;
    height: 1px; background: rgba(255,255,255,0.12); }
  .scanor::before { left: 0; } .scanor::after { right: 0; }
  #qr { width: 180px; height: 180px; margin: 0 auto 16px; padding: 12px; border-radius: 16px;
    background: #fff; box-sizing: border-box; }
  #qr img, #qr canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
</style>
</head>
<body>
  <!-- Shared logo gradient (amber → coral), referenced by both marks. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F59E42"/><stop offset="1" stop-color="#E85E52"/>
    </linearGradient>
  </defs></svg>

  <div id="stage">
    <video id="v" class="hidden" playsinline controls></video>

    <!-- Reconnect overlay: sits OVER the (frozen) video during a drop, so the
         last frame stays visible instead of falling back to a card. -->
    <div id="reconnect">
      <div class="rc-box">
        <div class="spinner"></div>
        <div class="rc-title">Reconnecting…</div>
        <div id="rc-sub" class="rc-sub"></div>
      </div>
    </div>

    <!-- Connecting / status -->
    <div id="panel" class="card">
      <img class="mark" src="icon.png" alt="">
      <p class="wordmark">Plex Downloader</p>
      <div class="spinner"></div>
      <h1>Connecting…</h1>
      <div id="status">Reaching the sender</div>
    </div>

    <!-- Code-entry landing -->
    <div id="entry" class="card hidden">
      <div class="entry-col entry-code">
      <img class="mark" src="icon.png" alt="">
      <p class="wordmark">Plex Downloader</p>
      <h1>Enter your code</h1>
      <p class="sub">Type the 4-digit code shown in the app.</p>
      <div id="pairs" class="hidden"></div>
      <div class="otp" id="otp">
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
        <input id="code" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="one-time-code" aria-label="Cast code">
      </div>
      <button id="go" class="btn" disabled>Watch</button>
      <div id="signal-error" class="signal-error" role="status" aria-live="polite"></div>
      </div>
      <div id="scan" class="entry-col hidden">
        <p class="scanor">or</p>
        <div id="qr" aria-label="Pairing QR code"></div>
        <p class="sub scanhint">Scan with the Plex Downloader app (or your camera) to connect this screen — no typing.</p>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<!-- mp4box.js: demuxes a multi-audio direct MP4 so the MSE engine can switch
     audio without reloading video (the same lib the Chromecast receiver uses,
     vendored locally so the receiver has no runtime CDN dependency for it). -->
<!-- Runtime polyfills for 2017-era TV engines, shared with the LAN receiver.
     MUST load before mp4box: they are installed non-enumerably, because a
     plain assignment leaks into for-in loops and mp4box walks arrays that way
     (it read our Array.prototype helpers as sample groups and crashed). -->
<script src="tv-polyfills.js"></script>
<script src="mp4box.all.min.js"></script>
<!-- The MSE engine, shared verbatim with the LAN receiver: hand-built init
     segments, keyframe-cut fragments, per-SourceBuffer mfhd sequences. -->
<script src="tv-mse.js"></script>
<script>
(function () {
  "use strict";
  window.PLEXCAST_VERSION = 8;   // bump when debugging cached-page confusion
  /* ES5 query parsing on purpose: URLSearchParams is Chrome 49+ and this is
     the first executable line on a 2017 TV — a TypeError here would blank the
     whole receiver. */
  function param(name) {
    var source = String(location.search || '') + '&' + String(location.hash || '').replace(/^#/, '');
    var found = new RegExp('(?:[?&#]|^)' + name + '=([^&#]*)').exec(source);
    return found ? decodeURIComponent(found[1].replace(/\+/g, ' ')) : '';
  }
  var qs = { get: function (name) { return param(name) || null; } };
  // sig = signalling mailbox; defaults to the app's built-in Worker so a plain
  // link (page + #code) needs no query. room = the short code from the hash,
  // ?room, or typed into the landing form.
  var sig = (qs.get("sig") || "https://plexcast-signal.rikard-wissing.workers.dev").replace(/\/+$/, "");
  var room = (qs.get("room") || location.hash.replace(/^#/, "")).trim();

  var v = document.getElementById("v");
  var panel = document.getElementById("panel");
  var entry = document.getElementById("entry");
  var statusEl = document.getElementById("status");

  // ---- Shared connect state ---------------------------------------------------
  // Declared ABOVE the code-entry landing's early return: the landing path uses
  // these too (its paired listener answers offers), and `var` hoisting would
  // otherwise leave them undefined there — a silently-swallowed TypeError.
  var dc = null;
  // The sender's load generation for the media currently loaded — echoed in
  // status so the sender can discard a stale (previous-load) report.
  var currentGen = 0;
  // Who we're connected to — replaced by the sender's "hi" (device name).
  var sender = "the sender";
  // A channel opened at least once — turns later failures from "can't traverse
  // NAT" advice into "lost the sender".
  var wasConnected = false;
  // Set by the landing: puts the page back into paired-listening after a cast
  // ends. Null on code/deep-link sessions.
  var resumeListening = null;
  // Debounce so the data-channel close and the connection-failed event (both
  // fire on a drop) only tear down once.
  var disconnecting = false;
  // Reconnect state. A live cast that drops (STUN-only + gatherOnce is fragile
  // to NAT rebinding / Wi-Fi blips, or the sender briefly backgrounding) keeps
  // its FROZEN last frame on screen under a "Reconnecting…" overlay — the video
  // is never torn down — and re-runs the handshake on the same room (the sender
  // keeps its offer re-armed) for up to RECONNECT_WINDOW_MS before giving up.
  // Playback resumes where it left off (the sender re-sends its load at the last
  // reported position).
  var reconnecting = false;
  var reconnectGen = 0;   // bumped per drop; a superseded loop bails
  var RECONNECT_WINDOW_MS = 5 * 60 * 1000;
  // Set when the sender deliberately ends the cast ({t:"stop"}) — then a channel
  // close is expected and we should NOT try to reconnect.
  var stopped = false;
  function nowMs() {
    try { if (window.performance && performance.now) return performance.now(); } catch (e) {}
    return new Date().getTime();
  }
  function handleDrop() {
    if (reconnecting) return;               // one loop owns retries; later drops feed back in
    if (stopped || !room) { giveUp(); return; }
    reconnecting = true;
    var myGen = ++reconnectGen;
    try { v.pause(); } catch (e) {}         // freeze the last frame — do NOT tear the video down
    showReconnect("Lost the connection to " + sender);
    var deadline = nowMs() + RECONNECT_WINDOW_MS;
    var delay = 800;
    /* ES5 retry loop (no async/await — this must parse on a 2017 TV): each
       attempt re-handshakes, and a superseded generation bails out. */
    function finish() {
      if (reconnectGen !== myGen) return;
      reconnecting = false;
      hideReconnect();
      if (!wasConnected) giveUp();          // window expired — the sender is really gone
    }
    function attempt() {
      if (!(reconnecting && reconnectGen === myGen && !stopped && nowMs() < deadline)) { finish(); return; }
      try { if (window.PAGEPC) window.PAGEPC.close(); } catch (e) {}
      rejectAllPending(new Error("connection closed"));
      dc = null;
      wasConnected = false;
      function afterAttempt() {
        if (reconnectGen !== myGen) return; // a newer drop took over
        if (wasConnected) { finish(); return; }   // reconnected — dc.onopen cleared the overlay
        setTimeout(function () {
          if (reconnectGen !== myGen) return;
          delay = Math.min(Math.round(delay * 1.5), 5000);   // back off, capped at 5s
          attempt();
        }, delay);
      }
      try { connect().then(afterAttempt, afterAttempt); }
      catch (e) { afterAttempt(); }
    }
    attempt();
  }
  // Sender stopped on purpose, or reconnection is exhausted — become a castable
  // device again: a paired page goes back to listening, a code/deep-link page
  // reloads bare to the code entry.
  function giveUp() {
    if (resumeListening) resumeListening();
    else location.href = location.pathname;
  }
  // QA trace of the connect state machine (timestamped one-liners).
  window.PLEXCAST_TRACE = [];
  function trace(s) { window.PLEXCAST_TRACE.push(Math.round(performance.now()/1000) + "s " + s); }
  var h1 = panel.querySelector("h1");

  function setStatus(main, sub) { if (main) h1.textContent = main; if (sub !== undefined) statusEl.textContent = sub; }
  function showVideo() { v.classList.remove("hidden"); panel.classList.add("hidden"); entry.classList.add("hidden"); hideReconnect(); }
  function showPanel() { v.classList.add("hidden"); panel.classList.remove("hidden"); entry.classList.add("hidden");
    panel.querySelector(".spinner").style.display = ""; }
  // The reconnect overlay sits OVER the video — it does not hide it, so the
  // last frame stays frozen underneath while we re-handshake.
  var reconnectEl = document.getElementById("reconnect");
  function showReconnect(sub) { document.getElementById("rc-sub").textContent = sub || ""; reconnectEl.classList.add("show"); }
  function hideReconnect() { reconnectEl.classList.remove("show"); }
  function fail(msg) { showPanel(); panel.querySelector(".spinner").style.display = "none"; setStatus("Can’t connect", msg); }

  // ---- Durable signalling ---------------------------------------------------
  function sigURL(p) { return (sig || "") + p; }
  function socketURL(p) { return sigURL(p).replace(/^http:/, "ws:").replace(/^https:/, "wss:"); }
  function signalSession() {
    try { return crypto.randomUUID().replace(/-/g, ""); }
    catch (e) { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
  }

  // A room keeps one hibernation-friendly WebSocket open. Cloudflare pushes
  // offers as soon as they exist, so paired TVs remain reachable in background
  // tabs without polling timers or periodic presence writes.
  function SignalSocket(signalRoom, onOffer, onState) {
    this.room = signalRoom;
    this.session = signalSession();
    this.onOffer = onOffer || function () {};
    this.onState = onState || function () {};
    this.socket = null;
    this.closed = false;
    this.ready = false;
    this.retry = 500;
    this.offers = [];
    this.offerWaiters = [];
    this.readyWaiters = [];
    this.open();
  }
  SignalSocket.prototype.open = function () {
    var self = this;
    if (self.closed) return;
    self.onState("Connecting to the signaling service…");
    var ws = new WebSocket(socketURL("/rtc/ws/" + encodeURIComponent(self.room) +
                           "?role=viewer&session=" + encodeURIComponent(self.session)));
    self.socket = ws;
    ws.onmessage = function (event) {
      var message;
      try { message = JSON.parse(event.data); } catch (e) { return; }
      if (message.type === "ready") {
        self.ready = true;
        self.retry = 500;
        self.onState("");
        var waiting = self.readyWaiters.splice(0);
        waiting.forEach(function (pending) { pending.resolve(); });
      } else if (message.type === "offer" && message.sdp && message.generation) {
        var offer = { sdp: message.sdp, generation: message.generation };
        self.offers = [offer];   // only the newest generation can be answered
        var waiter = self.offerWaiters.shift();
        if (waiter) waiter.resolve(self.offers.shift());
        self.onOffer(offer, self);
      } else if (message.type === "error") {
        self.onState(message.message || "The signaling service rejected this connection.");
      }
    };
    ws.onclose = function () {
      if (self.socket !== ws || self.closed) return;
      self.ready = false;
      self.onState("Signaling is unavailable. Retrying…");
      var delay = self.retry;
      self.retry = Math.min(Math.round(self.retry * 1.7), 8000);
      setTimeout(function () { self.open(); }, delay);
    };
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
  };
  SignalSocket.prototype.whenReady = function () {
    var self = this;
    if (self.ready && self.socket && self.socket.readyState === WebSocket.OPEN) return Promise.resolve();
    if (self.closed) return Promise.reject(new Error("signaling closed"));
    return new Promise(function (resolve, reject) {
      self.readyWaiters.push({ resolve: resolve, reject: reject });
    });
  };
  SignalSocket.prototype.waitForOffer = function () {
    var self = this;
    if (self.offers.length) return Promise.resolve(self.offers.shift());
    return new Promise(function (resolve, reject) {
      var pending = { resolve: resolve, reject: reject };
      self.offerWaiters.push(pending);
      setTimeout(function () {
        var i = self.offerWaiters.indexOf(pending);
        if (i >= 0) {
          self.offerWaiters.splice(i, 1);
          reject(new Error("The sender has not published a connection offer yet."));
        }
      }, 20000);
    });
  };
  SignalSocket.prototype.answer = function (generation, sdp) {
    var self = this;
    return self.whenReady().then(function () {
      self.socket.send(JSON.stringify({ type: "answer", generation: generation, sdp: sdp }));
    });
  };
  SignalSocket.prototype.close = function () {
    this.closed = true;
    this.ready = false;
    try { if (this.socket) this.socket.close(1000, "leaving"); } catch (e) {}
    this.offerWaiters.splice(0).forEach(function (waiter) { waiter.reject(new Error("signaling closed")); });
    this.readyWaiters.splice(0).forEach(function (pending) { pending.reject(new Error("signaling closed")); });
  };

  var activeSignal = null;
  var landingSignals = {};
  var signalErrorEl = document.getElementById("signal-error");
  function activeSignalState(message) {
    if (message) {
      if (!entry.classList.contains("hidden")) signalErrorEl.textContent = message;
      else setStatus("Connecting…", message);
    } else {
      signalErrorEl.textContent = "";
    }
  }
  function closeLandingSignals(except) {
    Object.keys(landingSignals).forEach(function (key) {
      if (landingSignals[key] !== except) landingSignals[key].close();
    });
    landingSignals = {};
  }
  window.addEventListener("pagehide", function () {
    closeLandingSignals();
    if (activeSignal) activeSignal.close();
  });

  // ---- Pairing: remember senders so they can cast here without a code -------
  // A pairing is {id, name}: the id is a long token the sender minted; it's
  // also the signaling room a paired cast arrives on. While this page is open
  // one room socket per pairing is both presence and the offer listener.
  var PAIRS_KEY = "plexcast.pairs";
  function loadPairs() {
    try { return JSON.parse(localStorage.getItem(PAIRS_KEY) || "[]"); } catch (e) { return []; }
  }
  function savePairs(list) { try { localStorage.setItem(PAIRS_KEY, JSON.stringify(list)); } catch (e) {} }
  function rememberPair(id, name) {
    if (!id) return;
    var list = loadPairs().filter(function (p) { return p.id !== id; });
    list.unshift({ id: String(id).slice(0, 64), name: String(name || "A device").slice(0, 40) });
    savePairs(list.slice(0, 8));
  }
  function forgetPair(id) { savePairs(loadPairs().filter(function (p) { return p.id !== id; })); }

  // No code in the link → show the landing form so a code can be typed straight
  // on a TV. Four cells over one hidden input; auto-submits on the 4th digit.
  if (!room) {
    panel.classList.add("hidden");
    entry.classList.remove("hidden");
    var input = document.getElementById("code");
    var cells = Array.prototype.slice.call(document.querySelectorAll("#otp .cell"));
    var go = document.getElementById("go");
    var submitted = false;

    function render() {
      var val = (input.value || "").replace(/\D/g, "").slice(0, 4);
      if (val !== input.value) input.value = val;
      var focused = document.activeElement === input;
      cells.forEach(function (c, i) {
        c.textContent = val[i] || "";
        c.classList.toggle("filled", i < val.length);
        c.classList.toggle("active", focused && i === val.length);
      });
      go.disabled = val.length !== 4;
      if (val.length === 4) submitCode();
    }
    function submitCode() {
      var val = (input.value || "").trim();
      if (val.length < 4 || submitted) return;
      submitted = true;
      closeLandingSignals();
      room = val;
      activeSignal = new SignalSocket(room, null, activeSignalState);
      showPanel();
      setStatus("Connecting…", "Reaching the sender");
      start(1);   // same self-healing handshake as a deep link
    }
    input.addEventListener("input", render);
    input.addEventListener("focus", render);
    input.addEventListener("blur", render);
    go.addEventListener("click", submitCode);
    document.getElementById("otp").addEventListener("click", function () { try { input.focus(); } catch (e) {} });
    try { input.focus(); } catch (e) {}
    render();

    // Paired senders: list them and listen — when one starts a cast to us, its
    // offer appears under the pairing token and we connect, no code needed.
    var pairsEl = document.getElementById("pairs");
    function renderPairs() {
      var pairs = loadPairs();
      pairsEl.classList.toggle("hidden", pairs.length === 0);
      pairsEl.innerHTML = pairs.length
        ? '<p class="pairhead">Ready to receive from</p>' : "";
      pairs.forEach(function (p) {
        var row = document.createElement("div");
        row.className = "pairrow";
        var dot = document.createElement("span"); dot.className = "dot";
        var name = document.createElement("span"); name.className = "name"; name.textContent = p.name;
        var hint = document.createElement("span"); hint.className = "hint"; hint.textContent = "listening…";
        var x = document.createElement("button"); x.className = "forget"; x.textContent = "×";
        x.title = "Forget this device";
        x.addEventListener("click", function () { forgetPair(p.id); renderPairs(); listenLanding(); });
        row.appendChild(dot); row.appendChild(name); row.appendChild(hint); row.appendChild(x);
        pairsEl.appendChild(row);
      });
    }
    renderPairs();

    // Reverse pairing: mint a rendezvous code and show it as a QR. The phone
    // scans it (in-app, or the system camera opens the deep link) and casts to
    // this screen — no code typed here. We listen on this room like a pairing token.
    var scanRoom = "";
    (function setupScanQR() {
      if (typeof qrcode !== "function") return;   // lib offline → code entry still works
      scanRoom = "s" + Math.random().toString(36).slice(2, 10);
      try {
        var qr = qrcode(0, "M");
        qr.addData("plexdownloader://pair?r=" + scanRoom);
        qr.make();
        document.getElementById("qr").innerHTML = qr.createImgTag(5, 0);
        document.getElementById("scan").classList.remove("hidden");
      } catch (e) { scanRoom = ""; }
    })();

    function acceptLandingOffer(offer, socket, target) {
      if (submitted) return;
      trace("signal: offer pushed to landing");
      submitted = true;
      activeSignal = socket;
      closeLandingSignals(socket);
      room = target.id;
      showPanel();
      setStatus("Connecting…", "Answering " + target.name);
      start(1);
    }

    function listenLanding() {
      closeLandingSignals();
      signalErrorEl.textContent = "";
      var targets = loadPairs().slice();
      if (scanRoom) targets.push({ id: scanRoom, name: "your phone" });
      targets.forEach(function (target) {
        var socket = new SignalSocket(target.id, function (offer, source) {
          acceptLandingOffer(offer, source, target);
        }, activeSignalState);
        landingSignals[target.id] = socket;
      });
    }

    // After a cast ends, come back here and restore the persistent listeners.
    resumeListening = function () {
      submitted = false;
      room = "";
      if (activeSignal) activeSignal.close();
      activeSignal = null;
      panel.classList.add("hidden");
      entry.classList.remove("hidden");
      renderPairs();
      listenLanding();
    };

    listenLanding();
    // NB: no early return — the whole script (data-channel machinery, the
    // playback stall/error listeners) must still be defined for a
    // session that begins here (typed code or paired listen). submitCode /
    // the listener callback starts itself; the deep-link auto-start at the
    // bottom is guarded on `room`.
  }

  // ---- Signalling offer/answer over the room socket -------------------------
  function getOffer() {
    if (!activeSignal || activeSignal.room !== room) {
      if (activeSignal) activeSignal.close();
      activeSignal = new SignalSocket(room, null, activeSignalState);
    }
    return activeSignal.waitForOffer();
  }
  function postAnswer(blob, generation) {
    if (!activeSignal) return Promise.reject(new Error("Signaling connection closed"));
    return activeSignal.answer(generation, blob);
  }

  // ---- Data-channel request/response ----------------------------------------
  // Requests are JSON {t:"req",id,path,start?,end?}; the phone replies with a
  // JSON {t:"res",id,status,len,ctype} header then binary body chunks (4-byte
  // LE id prefix), an empty-body chunk marking EOF. Multiple requests can be
  // in flight; each is keyed by id.
  var reqId = 1;
  var pending = {};   // id -> {resolve, reject, meta, chunks, got, timer, channel}
  // This is an INACTIVITY deadline, not a whole-request deadline. Every header
  // and body chunk rearms it, so a slow link may take as long as it needs while
  // a wedged SCTP request cannot strand the MSE pump forever. QA may shorten it.

      if (pending[id] !== p) return;
      trace("request #" + id + " idle for " + REQUEST_IDLE_MS + "ms — recovering channel");
      rejectPending(id, new Error("request made no progress"), true);
      // Closing/re-answering the peer is the only way to recover a data channel
      // that still reports `open` while its SCTP send queue is wedged. A landing
      // page has no room and uses this helper only in QA, so do not navigate it.
      if (room) handleDrop();
    }, REQUEST_IDLE_MS);
  }

  function fetchOverChannel(path, opts) {
    opts = opts || {};

      if (!channelReady()) { reject(new Error("channel closed")); return; }
      var id = reqId++;
      var requestChannel = dc;
      pending[id] = { resolve: resolve, reject: reject, meta: null, chunks: [], got: 0,
                      timer: null, channel: requestChannel };
      if (opts.onId) opts.onId(id);
      var msg = { t: "req", id: id, path: path };
      if (opts.start != null) msg.start = opts.start;
      if (opts.end != null) msg.end = opts.end;

  // stops streaming bytes we no longer want and can serve the new fragment now.
  function cancelRequest(id) {

  }

  // Find the hls.js audio/subtitle track whose rendition encodes the app
  // typeIndex — the package names them audio<N>.m3u8 / sub<N>.m3u8. A digit
  // boundary keeps "1" from matching "12"; checks the resolved url and the raw
  // manifest URI (hls.js exposes both).
  function renditionIndex(tracks, kind, typeIndex) {
    tracks = tracks || [];

    for (var i = 0; i < tracks.length; i++) {

      var u = t.url || (t.attrs && t.attrs.URI) || t.name || "";
      if (re.test(String(u))) return i;
    }
    return -1;
  }

  function onControl(obj) {
    switch (obj.t) {
      case "hi":
        // The sender introduces itself ("Rikard's MacBook Pro", "iPhone") so
        // status texts can say who we're connected to, not assume "the phone".
        if (obj.sender) {
          sender = String(obj.sender).slice(0, 40);
          window.PLEXCAST_SENDER = sender;   // observable for debugging/QA
          setStatus("Connected", "Waiting for " + sender + " to start a video…");
        }
        break;
      case "pair":
        // The sender hands us a pairing token: remember it so this browser can
        // receive future casts from that device without a code.
        rememberPair(obj.id, obj.name || sender);
        window.PLEXCAST_PAIRED = obj.id;   // observable for debugging/QA
        break;
      case "load": loadMedia(obj); break;
      case "play": v.play().catch(function () {}); break;
      case "pause": v.pause(); break;
      case "seek": if (obj.time != null) { try { v.currentTime = obj.time; } catch (e) {} } break;
      case "volume": if (obj.value != null) { try { v.volume = obj.value; } catch (e) {} } break;
      case "stop": stopped = true; stopMedia(); break;

        // reads it as its mp4box audio-track index (same file order).

          if (ai >= 0) { try { hls.audioTrack = ai; } catch (e) {} }

        break;

        // path hls.js needs subtitleDisplay on (it never self-enables); on the
        // direct-MP4 path we toggle the matching <track> overlay's mode.

          else {

            if (si >= 0) { try { hls.subtitleDisplay = true; hls.subtitleTrack = si; } catch (e) {} }
          }
        } else {
          selectSubtitle(obj.typeIndex);
        }
        break;
      case "subs":
        // Subtitles finished extracting after the load landed — add them in place
        // (no reload). Guard on gen so a stale list can't attach to newer media.
        if (obj.gen == null || obj.gen === currentGen) applySubtitles(obj.subs);
        break;
      case "res": {
        var p = pending[obj.id];
        if (p) { p.meta = obj; armRequestTimer(obj.id); }
        break;
      }
      case "err": {
        var pe = pending[obj.id];
        if (pe) rejectPending(obj.id, new Error("status " + obj.status), false);
        break;
      }

  }

  function onBody(buf) {
    // 4-byte LE id + payload; empty payload = EOF.
    var view = new DataView(buf);
    if (buf.byteLength < 4) return;
    var id = view.getUint32(0, true);
    var p = pending[id];
    if (!p) return;
    if (buf.byteLength === 4) {
      // EOF — assemble.
      delete pending[id];
      clearRequestTimer(p);
      var total = p.got;
      var out = new Uint8Array(total);
      var off = 0;
      for (var i = 0; i < p.chunks.length; i++) { out.set(p.chunks[i], off); off += p.chunks[i].length; }
      p.resolve({ data: out, meta: p.meta });
    } else {
      var chunk = new Uint8Array(buf, 4);
      p.chunks.push(chunk);
      p.got += chunk.length;
      armRequestTimer(id);
    }

  // ---- Service Worker: native-Range streaming for plain MP4s -----------------
  // A plain (non-package) MP4 plays through <video src>, which issues its own
  // HTTP Range requests. The SW (sw.js) intercepts them and asks US (we own the
  // data channel) for each byte window — so a big file streams a rolling window
  // of small chunks and seeks instantly, instead of downloading whole into a
  // Blob. If the SW isn't available/active, loadMedia falls back to the Blob.
  var swReady = false;
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").then(function () {
      if (navigator.serviceWorker.controller) swReady = true;
    }).catch(function (e) { console.warn("SW register failed", e); });
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (navigator.serviceWorker.controller) swReady = true;
    });

    // bytes (transferring the buffer, so it's a move not a copy).

      var d = e.data || {}, port = e.ports && e.ports[0];
      if (d.type !== "rtc-range" || !port) return;
      var reqId = null, done = false;
      // The SW aborts this window when the <video> seeks away mid-fetch. Drop the
      // in-flight request at the SENDER too — its IO queue is serial, so a stale
      // window left draining over a slow uplink would block the newly-seeked range.
      port.onmessage = function (ev) {
        if (ev.data && ev.data.abort) { done = true; if (reqId != null) cancelRequest(reqId); }
      };
      fetchOverChannel(d.path, { start: d.start, end: d.end,
                                 onId: function (id) { reqId = id; } }).then(function (r) {
        if (done) return;   // aborted while in flight

                           ctype: meta.ctype || "video/mp4", bytes: buf }, [buf]);
      }).catch(function () {
        if (done) return;
        done = true;
        port.postMessage({ status: 502, total: 0, bytes: new ArrayBuffer(0) });
      });

  // ---- hls.js loader over the data channel -----------------------------------
  // The stats shape must match hls.js's LoadStats exactly — it reads/writes
  // loading, parsing AND buffering timings; a missing `buffering` throws
  // "Cannot read properties of undefined (reading 'start')" on every append.
  /* TextDecoder landed in Chromium 38 itself, so decode by hand where it is
     missing. Manifests and WebVTT are the only text that comes through here. */
  function decodeText(bytes) {
    try { return new TextDecoder("utf-8").decode(bytes); } catch (e) {}
    var out = "", i = 0, c;
    while (i < bytes.length) {
      c = bytes[i++];
      if (c < 0x80) out += String.fromCharCode(c);
      else if (c < 0xE0) out += String.fromCharCode(((c & 0x1F) << 6) | (bytes[i++] & 0x3F));
      else if (c < 0xF0) out += String.fromCharCode(((c & 0x0F) << 12) | ((bytes[i++] & 0x3F) << 6) | (bytes[i++] & 0x3F));
      else {                                    // outside the BMP: surrogate pair
        var cp = ((c & 0x07) << 18) | ((bytes[i++] & 0x3F) << 12) | ((bytes[i++] & 0x3F) << 6) | (bytes[i++] & 0x3F);

  function DataChannelLoader() { this.stats = { aborted: false, loaded: 0, total: 0,
    retry: 0, chunkCount: 0, bwEstimate: 0, loading: { start: 0, first: 0, end: 0 },

  DataChannelLoader.prototype.abort = function () { this.stats.aborted = true; cancelRequest(this._id); this._id = null; };
  DataChannelLoader.prototype.load = function (context, config, callbacks) {

    var path = context.url.replace(location.origin, "");
    if (path.indexOf("http") === 0) { try { path = new URL(context.url).pathname; } catch (e) {} }
    var opts = { onId: function (id) { self._id = id; } };
    // Only request a byte range when hls.js gives a real one. Non-byterange
    // frags (e.g. subtitle VTTs) come with a degenerate rangeEnd=0; hls.js's own
    // loader treats that (truthy check) as "no range → whole file". A `!= null`
    // check would instead send end = 0-1 = -1, and the sender serves 0 bytes —
    // an empty VTT, so subtitles load but render nothing.
    if (context.rangeEnd) { opts.start = context.rangeStart; opts.end = context.rangeEnd - 1; }
    this.stats.loading.start = performance.now();
    fetchOverChannel(path, opts).then(function (r) {
      self._id = null;
      if (self.stats.aborted) return;

  var hls = null;
  var stallTimer = null;
  function clearStall() { if (stallTimer) { clearTimeout(stallTimer); stallTimer = null; } }
  function stopMedia() {
    clearStall();
    if (hls) { try { hls.destroy(); } catch (e) {} hls = null; }
    teardownEngine();
    clearSubtitles();
    v.pause(); v.removeAttribute("src"); v.load();
    showPanel(); setStatus("Stopped", "");
  }

  // A decode/codec failure: swap the video for a visible explanation (the old
  // path wrote to the hidden panel — an eternal spinner), and tell the sender
  // so its UI can say why nothing is playing.
  function playbackError(detail) {
    // While reconnecting, the dead channel makes the (still-mounted) hls throw —
    // ignore it so the frozen frame + overlay stay put instead of a "can't play" card.
    if (reconnecting) return;
    clearStall();
    if (hls) { try { hls.destroy(); } catch (e) {} hls = null; }
    teardownEngine();
    clearSubtitles();
    v.pause(); v.removeAttribute("src"); v.load();
    showPanel(); setStatus("Can’t play this", detail);
    try { if (channelReady()) dc.send(JSON.stringify({ t: "cantplay", reason: detail })); } catch (x) {}
  }

  // Friendly names for the codecs that actually bite in browsers.
  function codecName(c) {
    c = String(c || "").toLowerCase();
    if (c.indexOf("ec-3") === 0) return "E-AC-3 (Dolby Digital Plus)";
    if (c.indexOf("ac-3") === 0) return "AC-3 (Dolby Digital)";
    if (c.indexOf("dts") === 0) return "DTS";
    if (c.indexOf("mlp") === 0 || c.indexOf("truehd") >= 0) return "TrueHD";
    if (c.indexOf("hev") === 0 || c.indexOf("hvc") === 0) return "HEVC";
    if (c.indexOf("av01") === 0) return "AV1";
    return c;
  }

  var denied = (qs.get("deny") || "").toLowerCase().split(",").filter(Boolean);
  function canPlay(kind, codec) {
    if (!codec) return true;
    var c = String(codec).toLowerCase();
    for (var i = 0; i < denied.length; i++) if (c.indexOf(denied[i]) === 0) return false;
    try {
      return window.MediaSource
        ? MediaSource.isTypeSupported(kind + '/mp4; codecs="' + codec + '"')
        : v.canPlayType(kind + '/mp4; codecs="' + codec + '"') !== "";
    } catch (e) { return true; }
  }

  // The net under everything: if nothing decodes within 15s of starting, the
  // format is (in practice) unplayable — say so instead of spinning forever.
  function armStall() {
    clearStall();
    stallTimer = setTimeout(function () {
      if (v.readyState < 2) {
        playbackError("Nothing is decoding — this format may be unsupported by the browser.");
      }
    }, 15000);
  }
  v.addEventListener("loadeddata", clearStall);
  v.addEventListener("error", function () {
    if (!v.getAttribute("src") && !hls) return;   // teardown noise
    var err = v.error;
    playbackError("The browser reported a media error" +
                  (err && err.message ? ": " + err.message : "") + ".");
  });
  function play() {
    var pr = v.play();
    if (pr && pr.catch) pr.catch(function () {
      // Autoplay was blocked — this open had no user gesture (a deep-link / QR
      // scan, vs typing a code or clicking a device, which do count). No overlay:
      // the native <video controls> play button is right there, and any single
      // interaction anywhere retries play once, invisibly.
      var retry = function () {
        document.removeEventListener("pointerdown", retry);
        document.removeEventListener("keydown", retry);
        v.play().catch(function () {});
      };
      document.addEventListener("pointerdown", retry);
      document.addEventListener("keydown", retry);
    });
  }
  // Poster is served over the data channel too (no HTTP media server exists).
  function setPoster(path) {
    if (!path) return;
    fetchOverChannel(path, {}).then(function (r) {
      v.poster = URL.createObjectURL(new Blob([r.data], { type: (r.meta && r.meta.ctype) || "image/jpeg" }));
    }).catch(function () {});
  }
  // ---- MSE engine ------------------------------------------------------------
  // The engine itself lives in tv-mse.js, shared verbatim with the LAN receiver
  // — the build that plays on a 2017 webOS TV. Getting there needed three things
  // this page's old inline engine did not do: hand-built minimal init segments,
  // media fragments cut at keyframes, and per-SourceBuffer mfhd sequences. Rather
  // than keep two engines in step, this page supplies the only piece that
  // differs: a byte source that reads through the data channel instead of HTTP.
  //
  // tv-mse.js reaches back for three page-level helpers (dereferenced at call
  // time) and reports through window.tvReport.
  window.tvHelpers = { canPlay: canPlay, codecName: codecName, playbackError: playbackError };
  window.tvReport = trace;

  // fetchOverChannel is promise-based and takes an options bag; the engine wants
  // fetch(path, start, endInclusive, cb) -> {abort}. A cancelled window must NOT
  // surface as an error (the engine aborts its in-flight window on every seek).
  function channelFetcher(path, start, end, cb) {
    var id = null, cancelled = false;
    fetchOverChannel(path, { start: start, end: end, onId: function (n) { id = n; } })
      .then(function (r) {
        if (cancelled) return;
        var meta = r.meta || {};
        cb(null, { buffer: r.data.buffer, total: (meta.total != null ? meta.total : null),
                   status: meta.status || 206 });
      })
      .catch(function (e) { if (!cancelled) cb(e, null); });
    return { abort: function () { cancelled = true; if (id != null) cancelRequest(id); } };
  }

  var engine = null;
  // The last `load` command is retained only as a recovery path if a browser
  // cannot mutate its audio SourceBuffer or a native refill times out.
  var currentMedia = null;
  if (param("qa") === "1") {
    window.PLEXCAST_QA = {
      MseEngine: window.MseEngine,
      video: v,
      fetchOverChannel: fetchOverChannel,
      setDataChannel: function (channel) { dc = channel; },
      pendingCount: function () { return Object.keys(pending).length; },
    };
  }
  function teardownEngine() { if (engine) { try { engine.destroy(); } catch (e) {} engine = null; } }
  // A sender seek sets v.currentTime; when the engine drives playback it must
  // move the demux to match, or the video stalls at an unbuffered position.
  v.addEventListener("seeking", function () { if (engine) engine.reposition(v.currentTime || 0); });

  // ---- Subtitles: WebVTT sidecars as <track> overlays ------------------------
  // A muxed MP4's embedded text subs can't ride native <video>, so the sender
  // extracts each to WebVTT (served at /sub/<i> over the channel) and lists them
  // in the load (or a later `subs` message). We fetch each, wrap it in a blob
  // URL, and add a <track>; the sender's subtitleTrack message toggles which one
  // shows (by app typeIndex, -1 = off). Works on both the MSE and plain paths.
  var subBlobs = [];
  // The subtitle the sender last picked (app typeIndex, -1 = off). Sticky so a
  // subtitleTrack message that lands BEFORE the async <track>s are built (iOS
  // carries a subtitle choice into the load) still takes effect once they load.
  var wantedSubtitle = -1;
  // True while WE are mutating <track>s (build/select/clear). The textTracks
  // "change" listener ignores changes during this window so our own async
  // track-loading transitions don't look like a viewer picking a track.
  var applyingSubs = false, applyTimer = null;
  function beginSubMutation() {
    applyingSubs = true;
    if (applyTimer) clearTimeout(applyTimer);
    applyTimer = setTimeout(function () { applyingSubs = false; }, 400);
  }
  function trackMode(el) {
    var ti = parseInt(el.getAttribute("data-typeindex"), 10);
    return (wantedSubtitle >= 0 && ti === wantedSubtitle) ? "showing" : "disabled";
  }
  function clearSubtitles() {
    beginSubMutation();
    var tracks = v.querySelectorAll("track");
    for (var i = 0; i < tracks.length; i++) v.removeChild(tracks[i]);
    for (var j = 0; j < subBlobs.length; j++) { try { URL.revokeObjectURL(subBlobs[j]); } catch (e) {} }
    subBlobs = [];
  }
  function applySubtitles(list) {
    clearSubtitles();
    if (!list || !list.length) return;
    list.forEach(function (s) {
      fetchOverChannel(s.url, {}).then(function (r) {
        beginSubMutation();   // extend the guard as each async track lands
        var url = URL.createObjectURL(new Blob([r.data], { type: "text/vtt" }));
        subBlobs.push(url);
        var t = document.createElement("track");
        t.kind = "subtitles";
        t.label = s.label || s.lang || "Subtitles";
        if (s.lang && s.lang !== "und") t.srclang = s.lang;
        t.src = url;
        t.setAttribute("data-typeindex", String(s.typeIndex));
        v.appendChild(t);
        try { t.track.mode = trackMode(t); } catch (e) {}   // honour a choice made before we loaded
      }).catch(function () {});
    });
  }
  // Show the <track> whose app typeIndex matches (others disabled); -1 = all off.
  function selectSubtitle(typeIndex) {
    beginSubMutation();
    wantedSubtitle = (typeIndex == null) ? -1 : typeIndex;
    var tracks = v.querySelectorAll("track");
    for (var i = 0; i < tracks.length; i++) {
      try { tracks[i].track.mode = trackMode(tracks[i]); } catch (e) {}
    }
  }
  // Force exactly `wantedSubtitle` to show and everything else off. Browsers with
  // a captions/language preference auto-set a matching track to "showing" behind
  // our back (→ double subtitles); this re-asserts our single selection. Guarded
  // so its own mode writes don't re-enter the textTracks "change" handler.
  var enforcingSubs = false;
  function enforceSingleSubtitle() {
    if (enforcingSubs) return;
    enforcingSubs = true;
    var tracks = v.querySelectorAll("track");
    for (var i = 0; i < tracks.length; i++) {
      var want = trackMode(tracks[i]);
      try { if (tracks[i].track.mode !== want) tracks[i].track.mode = want; } catch (e) {}
    }
    enforcingSubs = false;
  }
  // Viewer changed subtitles via the receiver's own <video controls> CC menu →
  // tell the sender so its menu checkmark follows (two-way sync). During our own
  // mutations (applyingSubs) or a browser auto-show, just re-enforce our choice.
  if (v.textTracks) {
    v.textTracks.addEventListener("change", function () {
      if (enforcingSubs) return;
      if (applyingSubs) { enforceSingleSubtitle(); return; }   // browser auto-show during load → correct
      var showingList = [], tracks = v.querySelectorAll("track");
      for (var i = 0; i < tracks.length; i++) {
        if (tracks[i].track.mode === "showing") showingList.push(parseInt(tracks[i].getAttribute("data-typeindex"), 10));
      }
      // Already exactly our selection? (nothing showing when off; one track = us.)
      var ok = (wantedSubtitle < 0) ? showingList.length === 0
                                    : (showingList.length === 1 && showingList[0] === wantedSubtitle);
      if (ok) return;
      // The viewer's new pick = a showing track that isn't our current one; if
      // nothing (or only our old one) is showing, treat it as off.
      var pick = -1;
      for (var j = 0; j < showingList.length; j++) { if (showingList[j] !== wantedSubtitle) { pick = showingList[j]; break; } }
      wantedSubtitle = pick;
      enforceSingleSubtitle();                  // collapse to exactly the pick (kills any extra)
      if (channelReady()) { try { dc.send(JSON.stringify({ t: "pickSubtitle", typeIndex: pick })); } catch (e) {} }
    });
  }

  function loadMedia(m) {
    stopMedia();                 // pauses the old media → a final OLD-gen status
    stopped = false;             // a fresh load = active again (clears any prior stop)
    currentMedia = m;            // remembered so an audio switch can rebuild from it
    currentGen = m.gen || 0;     // now the current load; new statuses carry this
    // Start on the subtitle the sender picked (the user's choice for this file,
    // = the sender menu), else off. Sticky applySubtitles enables it on load.
    wantedSubtitle = (m.subtitleTypeIndex != null) ? m.subtitleTypeIndex : -1;
    showVideo();
    setPoster(m.poster);
    var startTime = m.startTime || 0;
    var isHls = /\.m3u8(\?|$)/i.test(m.url || "");
    if (isHls) {
      if (!window.Hls || !window.Hls.isSupported()) { fail("This browser can’t play the stream (no MSE)."); return; }
      hls = new window.Hls({ loader: DataChannelLoader, enableWorker: false });
      hls.loadSource(m.url);
      hls.attachMedia(v);
      hls.on(window.Hls.Events.MANIFEST_PARSED, function (evt, data) {
        // Check what the manifest declares BEFORE playing — an unsupported
        // codec (E-AC-3 audio is the classic) otherwise loads forever. Codecs
        // the manifest doesn't declare are neutral: error only when at least
        // one codec of a kind is declared and NONE of them are playable.
        var levels = (data && data.levels) || [];
        var atracks = (hls && hls.audioTracks) || [];
        var video = [], audio = [], i;
        for (i = 0; i < levels.length; i++) {
          if (levels[i].videoCodec) video.push(levels[i].videoCodec);
          if (levels[i].audioCodec) audio.push(levels[i].audioCodec);
        }
        for (i = 0; i < atracks.length; i++) {
          if (atracks[i].audioCodec) audio.push(atracks[i].audioCodec);
        }
        window.PLEXCAST_CODECS = { video: video.slice(), audio: audio.slice() };   // QA observable
        function verdict(kind, list) {
          if (!list.length) return null;
          for (var n = 0; n < list.length; n++) if (canPlay(kind, list[n])) return null;
          return list[0];
        }
        var badVideo = verdict("video", video);
        if (badVideo) {
          playbackError("This browser can’t decode the video: " + codecName(badVideo) + ".");
          return;
        }
        var badAudio = verdict("audio", audio);
        if (badAudio) {
          playbackError("This browser can’t decode the audio: " + codecName(badAudio) +
                        ". Convert the file (compatible audio) and cast again.");
          return;
        }
        if (startTime > 0) { try { v.currentTime = startTime; } catch (e) {} }
        armStall();
        play();
      });
      hls.on(window.Hls.Events.ERROR, function (evt, data) {
        if (!data || !data.fatal) return;
        var codec = (data.mimeType || "").replace(/^.*codecs="?([^";]+)"?.*$/, "$1");
        if (/bufferAddCodecError|bufferIncompatibleCodecsError|manifestIncompatibleCodecsError/.test(data.details || "")) {
          playbackError("This browser can’t decode this format" +
                        (codec ? ": " + codecName(codec) : "") + ".");
        } else {
          playbackError("Playback failed (" + (data.details || data.type || "unknown") + ").");
        }
      });
      return;
    }
    // A multi-audio MP4 (sender flagged {mse:true}): demux in-browser so audio
    // can switch without reloading video. mp4box pulls byte windows over the
    // same data channel; subtitles ride as <track> overlays.
    // Any direct file goes through the engine when it can run: it streams bounded
    // byte windows (a 2017 TV runs out of memory on a whole-file Blob) and it is
    // the only path that can switch audio tracks. The Service Worker route below
    // stays for engines without MediaSource/mp4box.
    if (!m.noEngine && window.MediaSource && typeof MP4Box !== "undefined" &&
        typeof window.MseEngine !== "undefined") {
      setStatus("Buffering…", "Streaming over the connection");
      teardownEngine();
      engine = new window.MseEngine(m.url, m.audioTypeIndex || 0, channelFetcher);
      v.src = engine.objectUrl;
      // The engine switches audio by reloading at the live position with the new
      // track selected — the shape that survives an old TV demuxer.
      engine.onAudioSwitch = function (index) {
        if (!currentMedia) return;
        var next = {}, at = v.currentTime || 0;
        for (var key in currentMedia) if (Object.prototype.hasOwnProperty.call(currentMedia, key)) next[key] = currentMedia[key];
        next.audioTypeIndex = index;
        next.startTime = at;
        loadMedia(next);
      };
      // An engine fatal on a modern browser can still fall back to the Service
      // Worker / Blob route; where neither exists, say so rather than spin.
      engine.onEngineFailed = function (reason) {
        trace("engine failed: " + reason);
        teardownEngine();
        if (swReady && navigator.serviceWorker && navigator.serviceWorker.controller) {
          var next = {}, at = v.currentTime || startTime || 0;
          for (var key in m) if (Object.prototype.hasOwnProperty.call(m, key)) next[key] = m[key];
          next.mse = false; next.noEngine = true; next.startTime = at;
          loadMedia(next);
        } else {
          playbackError("This browser could not play the file over the connection.");
        }
      };
      v.addEventListener("loadedmetadata", function once() {
        v.removeEventListener("loadedmetadata", once);
        if (startTime > 0) { try { v.currentTime = startTime; } catch (e) {} }
      });
      applySubtitles(m.subs);
      armStall();
      play();
      return;
    }
    // A plain (non-package) file. With the Service Worker active, <video> streams
    // it with native Range requests over the data channel — a rolling window of
    // small chunks, seekable, never the whole file.
    if (swReady && navigator.serviceWorker && navigator.serviceWorker.controller) {
      setStatus("Buffering…", "Streaming over the connection");
      v.src = "__rtc_stream__?p=" + encodeURIComponent(m.url);
      v.addEventListener("loadedmetadata", function once() {
        v.removeEventListener("loadedmetadata", once);
        if (startTime > 0) { try { v.currentTime = startTime; } catch (e) {} }
      });
      applySubtitles(m.subs);
      armStall();
      play();
      return;
    }
    // Fallback (SW unsupported, or not yet controlling on this first load): pull
    // the whole file over the channel into a Blob. Works for anything the browser
    // can play, but downloads fully first.
    setStatus("Buffering…", "Downloading over the connection");
    fetchOverChannel(m.url, {}).then(function (r) {
      var blob = new Blob([r.data], { type: (r.meta && r.meta.ctype) || "video/mp4" });
      v.src = URL.createObjectURL(blob);
      v.addEventListener("loadedmetadata", function once() {
        v.removeEventListener("loadedmetadata", once);
        if (startTime > 0) { try { v.currentTime = startTime; } catch (e) {} }
      });
      applySubtitles(m.subs);
      armStall();
      play();
    }).catch(function (e) { fail("Couldn’t load media: " + (e && e.message || e)); });
  }

  // ---- A friendly "who's watching" label for the phone's UI -----------------
  // Best-effort browser · OS from the user agent — nothing identifying.
  function viewerLabel() {
    var ua = navigator.userAgent || "";
    var browser =
      /Edg\//.test(ua) ? "Edge" :
      /OPR\/|Opera/.test(ua) ? "Opera" :
      /Firefox\//.test(ua) ? "Firefox" :
      /Chrome\//.test(ua) ? "Chrome" :
      /Safari\//.test(ua) ? "Safari" : "Browser";
    var os =
      /iPhone/.test(ua) ? "iPhone" :
      /iPad/.test(ua) ? "iPad" :
      /Android/.test(ua) ? "Android" :
      /Mac OS X|Macintosh/.test(ua) ? "macOS" :
      /Windows/.test(ua) ? "Windows" :
      /Linux/.test(ua) ? "Linux" : "";
    return os ? browser + " · " + os : browser;
  }

  // ---- Status back to the phone ---------------------------------------------
  function sendStatus(extra) {
    if (!channelReady()) return;
    // Tag with the load generation: when a new load pauses the old media it
    // fires one last status carrying the OLD duration — the sender ignores any
    // status whose gen isn't the current load, so its loader doesn't vanish.
    var s = { t: "status", gen: currentGen, position: v.currentTime || 0, duration: v.duration || 0, paused: v.paused };
    if (extra) for (var k in extra) s[k] = extra[k];
    dc.send(JSON.stringify(s));
  }
  v.addEventListener("timeupdate", function () { sendStatus(); });
  v.addEventListener("play", function () { sendStatus(); });
  v.addEventListener("pause", function () { sendStatus(); });
  v.addEventListener("ended", function () { sendStatus({ ended: true }); });

  // ---- WebRTC answerer -------------------------------------------------------
  // Written for old engines as well as current ones: Chromium 38 (webOS 3.x)
  // exposes only webkitRTCPeerConnection, wants real RTCSessionDescription
  // objects rather than plain ones, has callback-only SDP methods, and reads
  // {url:...} ice entries. Passing callbacks uses the legacy overload that
  // modern browsers still support, and any returned promise is wired to the
  // same handlers — so exactly one path fires either way.
  var PeerCtor = window.RTCPeerConnection || window.webkitRTCPeerConnection ||
                 window.mozRTCPeerConnection || null;
  var DescCtor = window.RTCSessionDescription || window.webkitRTCSessionDescription ||
                 window.mozRTCSessionDescription || null;
  var STUN_URLS = ["stun:stun.l.google.com:19302", "stun:stun1.l.google.com:19302",
                   "stun:stun2.l.google.com:19302", "stun:stun.cloudflare.com:3478"];
  function iceConfig() {
    var servers = [];
    for (var i = 0; i < STUN_URLS.length; i++) {
      servers.push({ url: STUN_URLS[i], urls: [STUN_URLS[i]] });
    }
    return { iceServers: servers };
  }
  /* Try the modern promise form FIRST and only fall back to the callback form
     when the engine refuses it. Passing callbacks *and* wiring the returned
     promise looks tolerant but is a bug: a browser that supports both invokes
     the callback AND resolves the promise — with undefined — so the two race,
     and createAnswer can hand setLocalDescription an undefined description
     ("Failed to parse SessionDescription"). Chromium 38 has no promise form and
     throws TypeError for the missing callbacks, which selects the legacy path. */
  function sdpCall(pc, method, arg) {
    return new Promise(function (resolve, reject) {
      var out = null, modern = false;
      try {
        out = (arg === null || arg === undefined) ? pc[method]() : pc[method](arg);
        modern = !!(out && typeof out.then === "function");
      } catch (e) { modern = false; }
      if (modern) { out.then(resolve, reject); return; }
      var settled = false;
      function ok(x) { if (!settled) { settled = true; resolve(x); } }
      function bad(e) { if (!settled) { settled = true; reject(e); } }
      try { (arg === null || arg === undefined) ? pc[method](ok, bad) : pc[method](arg, ok, bad); }
      catch (e2) { bad(e2); }
    });
  }
  function decode(blob) { return JSON.parse(atob(blob)); }
  function encode(desc) { return btoa(JSON.stringify({ type: desc.type, sdp: desc.sdp })); }
  function describe(offer) {
    if (!DescCtor) return offer;
    try { return new DescCtor({ type: offer.type || "offer", sdp: offer.sdp }); }
    catch (e) { return offer; }
  }
  /* An engine from the Chromium 38 era only parses the 2013 data-channel m-line
     ("DTLS/SCTP <port>" + a=sctpmap); libwebrtc offers the modern
     "UDP/DTLS/SCTP webrtc-datachannel" + a=sctp-port. Used only as a retry when
     setRemoteDescription rejects the offer as sent. */
  function legacySdp(sdp) {
    var text = String(sdp), port = "5000";
    var found = /a=sctp-port:(\d+)/.exec(text);
    if (found) port = found[1];
    text = text.replace(/^m=application (\d+) UDP\/DTLS\/SCTP webrtc-datachannel\s*$/m,
                        "m=application $1 DTLS/SCTP " + port);
    text = text.replace(/^a=sctp-port:\d+\s*$/m, "a=sctpmap:" + port + " webrtc-datachannel 1024");
    return text;
  }
  function wait(ms) { return new Promise(function (res) { setTimeout(res, ms); }); }

  function connect() {
    disconnecting = false;   // fresh attempt — arm the drop handler again
    if (!PeerCtor) {
      fail("This browser has no WebRTC support.");
      return Promise.reject(new Error("no RTCPeerConnection"));
    }
    var pc;
    try { pc = new PeerCtor(iceConfig()); }
    catch (e) {
      fail("This browser could not open a WebRTC connection.");
      return Promise.reject(e);
    }
    pc.ondatachannel = function (e) {
      dc = e.channel;
      dc.binaryType = "arraybuffer";
      dc.onmessage = function (ev) {
        if (typeof ev.data === "string") { try { onControl(JSON.parse(ev.data)); } catch (x) {} }
        else onBody(ev.data);
      };
      dc.onopen = function () {
        wasConnected = true;
        reconnecting = false;   // reconnected — stop the loop and drop the overlay now
        hideReconnect();
        setStatus("Connected", "Waiting for " + sender + " to start a video…");
        // The hello carries the pairing tokens this browser holds, so a sender
        // that already knows one recognises us and reuses it — connecting with
        // a fresh code doesn't create a duplicate pairing on either end.
        try {
          dc.send(JSON.stringify({ t: "hello", label: viewerLabel(),
                                   pairings: loadPairs().map(function (p) { return p.id; }) }));
        } catch (x) {}
      };
      dc.onclose = function () { handleDrop(); };
    };
    window.PAGEPC = pc;   // QA observable
    window.PLEXCAST_ICE_LOG = window.PLEXCAST_ICE_LOG || [];
    pc.oniceconnectionstatechange = function () {
      window.PLEXCAST_ICE_LOG.push(nowMs() % 100000 + " ice:" + pc.iceConnectionState);
      trace("ice " + pc.iceConnectionState);
    };
    // connectionState is Chrome 72+; on older engines this never fires and a
    // dead link surfaces through the ice state / channel close instead.
    pc.onconnectionstatechange = function () {
      window.PLEXCAST_ICE_LOG.push(nowMs() % 100000 + " conn:" + pc.connectionState);
      if (pc.connectionState !== "failed") return;
      // Failing BEFORE a channel ever opened is a NAT-traversal problem; failing
      // after means the sender vanished (app quit, network drop) — go back to
      // listening so we're castable again.
      if (wasConnected) handleDrop();
      else fail("Couldn’t establish a direct connection (this network may need TURN).");
    };

    setStatus("Connecting…", "Fetching connection info");
    var signalOffer = null;
    return getOffer().then(function (offer) {
      signalOffer = offer;
      trace("getOffer ok len=" + offer.sdp.length);
      var parsed = decode(offer.sdp);
      return sdpCall(pc, "setRemoteDescription", describe(parsed)).catch(function (e) {
        var rewritten = legacySdp(parsed.sdp);
        if (rewritten === parsed.sdp) throw e;
        trace("setRemoteDescription failed (" + (e && e.message || e) + ") — retrying with legacy DTLS/SCTP");
        return sdpCall(pc, "setRemoteDescription", describe({ type: parsed.type, sdp: rewritten }));
      });
    }).then(function () {
      return sdpCall(pc, "createAnswer", null);
    }).then(function (answer) {
      return sdpCall(pc, "setLocalDescription", answer);
    }).then(function () {
      // Non-trickle: wait for ICE gathering to finish so the answer is complete.
      return new Promise(function (res) {
        if (pc.iceGatheringState === "complete") { res(); return; }
        var t = setTimeout(res, 4000);
        pc.onicegatheringstatechange = function () {
          if (pc.iceGatheringState === "complete") { clearTimeout(t); res(); }
        };
      });
    }).then(function () {
      setStatus("Connecting…", "Handing back the answer");
      return postAnswer(encode(pc.localDescription), signalOffer.generation);
    }).then(function () {
      trace("answer posted for room " + room.slice(0, 8));
      // Give ICE its normal connection window. The sender acknowledges and clears
      // the generation over its own socket; if ICE still does not open, its
      // handshake watchdog publishes a fresh generation and this socket receives
      // it without polling.
      return wait(12000);
    }).then(function () {
      if (!wasConnected) {
        trace("retry: answer sent but ICE never connected");
        try { pc.close(); } catch (x) {}
        dc = null;
        throw { retry: true };
      }
    });
  }

  function start(attempt) {
    connect().catch(function (e) {
      if (e && e.retry && attempt < 4) {
        setStatus("Connecting…", "Trying again…");
        start(attempt + 1);
      } else {
        fail(String(e && e.message || e));
      }
    });
  }
  // A deep link (#code / ?room=) connects straight away; a landing session
  // (typed code or paired listen) starts itself once it has a room.
  if (room) start(1);
})();
</script>
</body>
</html>
